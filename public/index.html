<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SproutRipple PH — HR & Payroll Platform</title>
<script>(function(){try{if(localStorage.getItem('sr_dark_mode')==='1')document.documentElement.setAttribute('data-dark','');}catch(e){}})();</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f3ef;--surface:#fff;--surface2:#faf9f6;--border:#e6e4de;--border2:#ccc9bf;
  --txt:#18171a;--txt2:#6b6a72;--txt3:#9d9ca5;
  --accent:#4f46e5;--accent2:#6366f1;--accent-bg:#eef2ff;--accent-txt:#3730a3;
  --green:#059669;--green-bg:#d1fae5;--green-txt:#065f46;
  --amber:#d97706;--amber-bg:#fef3c7;--amber-txt:#92400e;
  --red:#dc2626;--red-bg:#fee2e2;--red-txt:#991b1b;
  --blue:#2563eb;--blue-bg:#dbeafe;--blue-txt:#1e40af;
  --purple:#7c3aed;--purple-bg:#ede9fe;--purple-txt:#4c1d95;
  --orange:#ea580c;--orange-bg:#ffedd5;--orange-txt:#9a3412;
}

/* ══ DARK MODE ══════════════════════════════════════════════ */
[data-dark]{
  --bg:#0f172a;--surface:#1e293b;--surface2:#162032;
  --border:#2d3f55;--border2:#3d526a;
  --txt:#f1f5f9;--txt2:#cbd5e1;--txt3:#64748b;
  --accent:#818cf8;--accent2:#6366f1;
  --accent-bg:#1e1b4b;--accent-txt:#a5b4fc;
  --green:#34d399;--green-bg:#064e3b;--green-txt:#6ee7b7;
  --amber:#fbbf24;--amber-bg:#451a03;--amber-txt:#fde68a;
  --red:#f87171;--red-bg:#450a0a;--red-txt:#fca5a5;
  --blue:#60a5fa;--blue-bg:#1e3a5f;--blue-txt:#93c5fd;
  --purple:#a78bfa;--purple-bg:#2e1065;--purple-txt:#c4b5fd;
  --orange:#fb923c;--orange-bg:#431407;--orange-txt:#fed7aa;
}
[data-dark] .topbar,[data-dark] .sidebar{background:#1e293b !important;border-color:#2d3f55}
[data-dark] .modal-box{background:#1e293b;border-color:#2d3f55}
[data-dark] .login-wrap{background:#0f172a}
[data-dark] .login-box{background:#1e293b;border-color:#2d3f55;box-shadow:0 4px 32px rgba(0,0,0,.5)}
[data-dark] .card,[data-dark] .metric{background:#1e293b !important;border-color:#2d3f55}
[data-dark] thead tr,[data-dark] thead th{background:#162032 !important;border-color:#2d3f55}
[data-dark] tbody tr{background:#1e293b !important}
[data-dark] tbody tr:nth-child(even){background:#162032 !important}
[data-dark] tr:hover td{background:#1e3a5f !important}
[data-dark] td{border-color:#2d3f55}
[data-dark] .field input,[data-dark] .field select,[data-dark] .field textarea,
[data-dark] input.finput,[data-dark] select.finput,[data-dark] textarea.finput{background:#0f172a;color:#f1f5f9;border-color:#2d3f55}
[data-dark] .field input:focus,[data-dark] input.finput:focus{box-shadow:0 0 0 3px rgba(129,140,248,.2)}
[data-dark] .nav-link:hover{background:#2d3f55}
[data-dark] .ai-box{background:#162032;border-color:#2d3f55}
[data-dark] .pill-opt,[data-dark] .qs-btn,[data-dark] .btn{background:#1e293b;border-color:#2d3f55;color:#cbd5e1}
[data-dark] .btn:hover{background:#2d3f55}
[data-dark] .btn-primary{background:#818cf8;color:#fff;border-color:#818cf8}
[data-dark] .btn-primary:hover{background:#6366f1}
[data-dark] .btn-danger{background:#f87171;border-color:#f87171}
[data-dark] .btn-amber{background:#f59e0b;border-color:#f59e0b}
[data-dark] .modal-overlay{background:rgba(0,0,0,.7)}
[data-dark] .tabs,[data-dark] .divider,[data-dark] .info-row,[data-dark] .remit-card,[data-dark] .loan-row{border-color:#2d3f55}
[data-dark] .user-pill,[data-dark] .notif-btn{background:#1e293b;border-color:#2d3f55;color:#cbd5e1}
[data-dark] .step-todo{background:#0f172a;border-color:#2d3f55}
[data-dark] .stage-new{background:#1e293b;color:#94a3b8}

body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;font-size:14px;line-height:1.5}
/* ---- SHELL ---- */
.shell{display:flex;min-height:100vh}
.topbar{position:fixed;top:0;left:0;right:0;height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem 0 0;z-index:30}
.brand{display:flex;align-items:center;gap:10px;padding:0 1.25rem;flex-shrink:0;min-width:0}
.brand-mark{height:32px;width:32px;min-width:32px;background:linear-gradient(135deg,#4f46e5,#7c3aed);border-radius:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;overflow:hidden;transition:width .2s}
.brand-mark.has-logo{width:auto;min-width:32px;max-width:140px;background:transparent}
.brand-name{font-weight:700;font-size:15px;letter-spacing:-.3px;color:var(--txt)}
.topbar-right{display:flex;align-items:center;gap:12px}
.notif-btn{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--txt2)}
.user-pill{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:8px;border:1px solid var(--border);cursor:pointer;background:var(--surface)}
.avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#4f46e5,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff;flex-shrink:0}
.avatar.sm{width:24px;height:24px;font-size:9px}
.avatar.lg{width:40px;height:40px;font-size:13px}
/* ---- SIDEBAR ---- */
.sidebar{width:252px;background:var(--surface);border-right:1px solid var(--border);position:fixed;top:56px;bottom:0;left:0;overflow:hidden;padding:0;display:flex;flex-direction:column;box-shadow:8px 0 24px rgba(15,23,42,.025);z-index:20}
.sidebar-tools{padding:14px 12px 10px;border-bottom:1px solid var(--border);background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--surface) 92%,var(--bg)))}
.sidebar-label{display:flex;align-items:center;justify-content:space-between;padding:0 3px 8px;font-size:10px;font-weight:800;color:var(--txt3);text-transform:uppercase;letter-spacing:.9px}
.sidebar-label span:last-child{font-weight:600;text-transform:none;letter-spacing:0;opacity:.75}
.sidebar-search{display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;border:1px solid var(--border);border-radius:10px;background:var(--bg);transition:border-color .15s,box-shadow .15s}
.sidebar-search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.sidebar-search input{width:100%;border:0;outline:0;background:transparent;color:var(--txt);font:inherit;font-size:12px}
.sidebar-search input::placeholder{color:var(--txt3)}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px 8px 14px;scrollbar-width:thin;scrollbar-color:var(--border2) transparent}
.nav-section-block{margin:2px 0 7px}
.nav-section{display:flex;align-items:center;justify-content:space-between;width:100%;font-size:10px;font-weight:800;color:var(--txt3);padding:8px 9px 5px;text-transform:uppercase;letter-spacing:.75px;cursor:pointer;border-radius:7px;user-select:none;transition:color .15s,background .15s}
.nav-section:hover{color:var(--txt2);background:var(--bg)}
.nav-section-chevron{font-size:13px;line-height:1;transition:transform .18s;opacity:.65}
.nav-section.collapsed .nav-section-chevron{transform:rotate(-90deg)}
.nav-items{display:grid;grid-template-rows:1fr;transition:grid-template-rows .2s ease,opacity .15s ease;opacity:1}
.nav-items.collapsed{grid-template-rows:0fr;opacity:0}
.nav-items-inner{min-height:0;overflow:hidden}
.nav-link{display:flex;align-items:center;gap:10px;min-height:38px;margin:2px 0;padding:8px 10px;font-size:12.5px;font-weight:500;color:var(--txt2);cursor:pointer;border-radius:9px;transition:background .15s,color .15s,transform .15s;position:relative}
.nav-link:hover{background:var(--bg);color:var(--txt);transform:translateX(1px)}
.nav-link.active{background:linear-gradient(90deg,var(--accent-bg),color-mix(in srgb,var(--accent-bg) 65%,transparent));color:var(--accent);font-weight:700;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 14%,transparent)}
.nav-link.active::before{content:'';position:absolute;left:0;top:9px;bottom:9px;width:3px;background:var(--accent);border-radius:0 4px 4px 0}
.nav-link .nav-icon{width:17px;height:17px;flex-shrink:0;opacity:.75}
.nav-link.active .nav-icon{opacity:1}
.nav-badge{margin-left:auto;min-width:19px;text-align:center;background:var(--red);color:#fff;font-size:9px;font-weight:800;padding:2px 6px;border-radius:999px;box-shadow:0 2px 6px rgba(239,68,68,.2)}
.sidebar-footer{padding:10px 12px 12px;border-top:1px solid var(--border);background:var(--surface)}
.sidebar-user{display:flex;align-items:center;gap:9px;padding:9px;border-radius:11px;background:var(--bg);border:1px solid var(--border);margin-bottom:7px}
.sidebar-user-copy{min-width:0;flex:1}
.sidebar-user-name{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar-user-role{font-size:10px;color:var(--txt3);text-transform:capitalize}
.sidebar-signout{color:var(--txt3);justify-content:center;min-height:34px}
.sidebar-signout:hover{color:var(--red-txt);background:var(--red-bg);transform:none}
/* ---- CONTENT ---- */
.content{margin-left:252px;margin-top:56px;padding:1.5rem;min-height:calc(100vh - 56px);min-width:0;transition:margin-left .25s}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.25rem;gap:12px}
.page-title{font-size:20px;font-weight:700;letter-spacing:-.4px}
.page-sub{font-size:13px;color:var(--txt3);margin-top:2px}
/* ---- CARDS ---- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.25rem;margin-bottom:1rem}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.card-title{font-size:13px;font-weight:600;color:var(--txt)}
.card-sub{font-size:12px;color:var(--txt3);margin-top:2px}
/* ---- METRICS ---- */
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:1rem}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:1rem}
.metric-label{font-size:11px;color:var(--txt3);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.metric-val{font-size:26px;font-weight:700;letter-spacing:-.5px;font-family:'JetBrains Mono',monospace}
.metric-change{font-size:11px;margin-top:4px}
/* ---- BADGES ---- */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.b-present,.b-active,.b-approved,.b-paid,.b-completed{background:var(--green-bg);color:var(--green-txt)}
.b-absent,.b-rejected,.b-failed,.b-terminated{background:var(--red-bg);color:var(--red-txt)}
.b-late,.b-pending,.b-processing,.b-warning{background:var(--amber-bg);color:var(--amber-txt)}
.b-leave,.b-info{background:var(--blue-bg);color:var(--blue-txt)}
.b-admin{background:var(--purple-bg);color:var(--purple-txt)}
.b-employee{background:var(--accent-bg);color:var(--accent-txt)}
.b-probationary{background:var(--orange-bg);color:var(--orange-txt)}
/* ---- BUTTONS ---- */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--txt);font-family:'Inter',sans-serif;transition:all .1s;white-space:nowrap}
.btn:hover{background:var(--bg);border-color:var(--border2)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn-primary:hover{background:#4338ca}
.btn-success{background:var(--green);color:#fff;border-color:var(--green)}
.btn-danger{background:var(--red);color:#fff;border-color:var(--red)}
.btn-amber{background:var(--amber);color:#fff;border-color:var(--amber)}
.btn-amber:hover{opacity:.88}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}
.btn-icon{width:30px;height:30px;padding:0;justify-content:center;border-radius:7px}
/* ---- TABLES ---- */
table{width:100%;border-collapse:collapse;font-size:13px}
thead tr,thead th{background:var(--surface2) !important;color:var(--txt3);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;padding:9px 12px;text-align:left;border-bottom:2px solid var(--border)}
tbody tr{background:var(--surface) !important}
.payroll-register-wrap{max-height:62vh;overflow:auto;border:1px solid var(--border);border-radius:10px;margin-bottom:12px}
.payroll-register{border-collapse:separate;border-spacing:0;font-size:11px;table-layout:auto}
.payroll-register thead th{position:sticky;top:0;z-index:4}
.payroll-register .payroll-employee-col{position:sticky;left:0;z-index:3;min-width:240px;max-width:240px;background:var(--surface)!important;box-shadow:2px 0 0 var(--border)}
.payroll-register thead .payroll-employee-col{z-index:7;background:var(--surface2)!important}
.payroll-register tfoot td{position:sticky;bottom:0;z-index:4;background:var(--surface2)!important;border-top:2px solid var(--border)}
.payroll-register tfoot .payroll-employee-col{z-index:6;background:var(--surface2)!important}
.payroll-component-head{min-width:112px;text-align:right!important;padding:7px 8px!important}
.payroll-component-head small{display:block;font-size:8px;line-height:1.2;margin-top:2px;color:var(--txt3);text-transform:none;letter-spacing:0;white-space:normal}
.payroll-money{text-align:right;font-family:monospace;white-space:nowrap;padding:6px 8px!important}
tbody tr:nth-child(even){background:var(--bg) !important}
td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;color:var(--txt)}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--accent-bg) !important}
/* ---- FORMS ---- */
.field{margin-bottom:12px}
.field label,.flabel{display:block;font-size:11px;font-weight:600;color:var(--txt3);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.field input,.field select,.field textarea,input.finput,select.finput,textarea.finput{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--surface);color:var(--txt);font-family:'Inter',sans-serif;outline:none;transition:border .12s}
.field input:focus,.field select:focus,.field textarea:focus,input.finput:focus,select.finput:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.field textarea{resize:vertical}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
/* ---- TABS ---- */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:1.125rem;overflow-x:auto}
.tab{padding:9px 16px;font-size:13px;cursor:pointer;color:var(--txt3);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500;white-space:nowrap;transition:all .1s}
.tab:hover{color:var(--txt2)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
/* ---- MODAL ---- */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:1rem}
.modal-box{background:var(--surface);border-radius:14px;padding:1.5rem;width:600px;max-width:100%;max-height:92vh;overflow-y:auto;border:1px solid var(--border)}
.modal-title{font-size:16px;font-weight:700;margin-bottom:1.25rem;display:flex;justify-content:space-between;align-items:center;letter-spacing:-.2px}
.close-x{background:none;border:none;cursor:pointer;color:var(--txt3);font-size:22px;line-height:1}
.close-x:hover{color:var(--txt)}
/* ---- MISC ---- */
.emp-cell{display:flex;align-items:center;gap:10px}
.empty-state{text-align:center;padding:3rem;color:var(--txt3);font-size:13px}
.empty-state .ei{font-size:32px;margin-bottom:8px}
.divider{border:none;border-top:1px solid var(--border);margin:14px 0}
.mono{font-family:'JetBrains Mono',monospace;font-size:12px}
.progress-bar{background:var(--bg);border-radius:999px;height:6px;overflow:hidden}
.progress-fill{height:100%;border-radius:999px;background:var(--accent)}
.chip{display:inline-block;padding:2px 9px;border-radius:6px;font-size:11px;font-weight:600;border:1px solid var(--border);color:var(--txt2);margin:2px}
.onboard-step{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.onboard-step:last-child{border-bottom:none}
.step-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.step-done{background:var(--green-bg);color:var(--green-txt)}
.step-current{background:var(--accent-bg);color:var(--accent)}
.step-todo{background:var(--bg);color:var(--txt3);border:1px solid var(--border)}
.info-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px}
.info-row:last-child{border-bottom:none}
.info-label{color:var(--txt3);font-size:12px}
.kpi-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1rem}
.mini-chart{display:flex;align-items:flex-end;gap:3px;height:40px;margin-top:8px}
.bar-col{background:var(--accent-bg);border-radius:3px 3px 0 0;min-width:10px;flex:1;transition:background .1s}
.bar-col:hover{background:var(--accent)}
.bar-col.bar-active{background:var(--accent)}
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg)}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:2.25rem;width:380px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.action-row{display:flex;gap:8px;flex-wrap:wrap}
.pill-select{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pill-opt{padding:5px 12px;border-radius:999px;font-size:12px;font-weight:500;border:1px solid var(--border);cursor:pointer;background:var(--surface);color:var(--txt2)}
.pill-opt.sel{background:var(--accent-bg);color:var(--accent);border-color:var(--accent)}
.loan-row{padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px}
.section-header{font-size:12px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.6px;margin:1rem 0 .5rem}
.ai-box{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:1rem;margin-top:12px;font-size:13px;line-height:1.7;min-height:44px;white-space:pre-wrap;color:var(--txt)}
.qs-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:6px;margin-bottom:14px}
.qs-btn{text-align:left;font-size:12px;padding:8px 11px;border-radius:8px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--txt2);font-family:'Inter',sans-serif;line-height:1.4;transition:all .1s}
.qs-btn:hover{background:var(--bg);border-color:var(--border2);color:var(--txt)}
.recruit-stage{display:inline-block;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:600}
.stage-new{background:#f1f5f9;color:#475569}
.stage-screen{background:var(--blue-bg);color:var(--blue-txt)}
.stage-interview{background:var(--purple-bg);color:var(--purple-txt)}
.stage-offer{background:var(--amber-bg);color:var(--amber-txt)}
.stage-hired{background:var(--green-bg);color:var(--green-txt)}
.stage-rejected{background:var(--red-bg);color:var(--red-txt)}
.perf-bar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.perf-label{width:120px;font-size:12px;color:var(--txt2);flex-shrink:0}
.perf-track{flex:1;background:var(--bg);border-radius:999px;height:8px;overflow:hidden}
.perf-fill{height:100%;border-radius:999px}
.perf-score{width:32px;text-align:right;font-size:12px;font-weight:600;font-family:'JetBrains Mono',monospace}
.remit-card{border:1px solid var(--border);border-radius:10px;padding:1rem;margin-bottom:10px}
.remit-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.remit-name{font-weight:600;font-size:14px}
.remit-due{font-size:12px;color:var(--txt3)}
.check-item{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;cursor:pointer}
.check-item input{width:auto;accent-color:var(--accent)}
</style>

<body>
<div id="root"></div>
<script src="/timekeeping-core.js"></script>
<script src="/payroll-rule-engine.js?v=20260803-four-decimal-divisor-engine"></script>

/* ---- EMPLOYEE MOVEMENT TRACKING ---- */
/* Fields that trigger a movement record when changed */
const MOVEMENT_FIELDS=[
  {key:'pos',       label:'Position'},
  {key:'bandLevel', label:'Band Level'},
  {key:'bu',        label:'Business Unit'},
  {key:'dept',      label:'Department'},
  {key:'team',      label:'Team'},
  {key:'subteam',   label:'Sub-team'},
  {key:'salaryPM',  label:'Monthly Compensation'},
];
function detectMovementChanges(e,draft){
  return MOVEMENT_FIELDS.filter(f=>{
    const oldV=String(e[f.key]??'').trim();
    const newV=String(draft[f.key]!==undefined?draft[f.key]:e[f.key]??'').trim();
    return oldV!==newV;
  }).map(f=>({
    field:f.key,label:f.label,
    from:e[f.key]??'',
    to:draft[f.key]!==undefined?draft[f.key]:e[f.key]??'',
  }));
}
function movementType(changes){
  const keys=changes.map(c=>c.field);
  if(keys.includes('salaryPM')&&keys.length===1)return'Compensation Change';
  if(keys.some(k=>['bu','dept','team','subteam'].includes(k))&&!keys.includes('pos')&&!keys.includes('bandLevel'))return'Transfer';
  if(keys.some(k=>['pos','bandLevel'].includes(k)))return'Position Change';
  return'Profile Update';
}

/* Returns numeric rank for a band level code (higher = more senior).
   Uses the `rank` property if set, falls back to array position. */
function getBandRank(code){
  if(!code)return 0;
  const b=LOOKUPS.bandLevels.find(x=>x.code===code);
  if(!b)return 0;
  return b.rank||LOOKUPS.bandLevels.indexOf(b)+1;
}

/* Band level color category for badges */
function getBandColor(code){
  const r=getBandRank(code);
  const max=Math.max(...LOOKUPS.bandLevels.map(b=>b.rank||0));
  if(r>=max-1)return{bg:'var(--red-bg)',txt:'var(--red-txt)'};    /* top 2 = leadership */
  if(r>=max-3)return{bg:'var(--amber-bg)',txt:'var(--amber-txt)'}; /* next 2 = management */
  return{bg:'var(--accent-bg)',txt:'var(--accent-txt)'};            /* IC = standard */
}

/* Returns the same day N months after the hire date (exact month offset).
   e.g. hired 2025-06-15 →
     N=3: Sep 15, 2025
     N=5: Nov 15, 2025
     N=6: Dec 15, 2025  (probation end)
   JS handles month overflow naturally:
     Jan 31 + 1 month → Mar 3 (Feb has no day 31) */
function evalDate(hiredStr, nMonths){
  if(!hiredStr)return'';
  const d=new Date(hiredStr);
  if(isNaN(d))return'';
  const res=new Date(d.getFullYear(), d.getMonth()+nMonths, d.getDate());
  return res.toISOString().slice(0,10);
}

function computeStat(item,ms,emp){
  switch(item.computeKey){
    case 'sss':  return sssContrib(ms);
    case 'mpf':  return mpfContrib(ms);
    case 'ph':   return phContrib(ms);
    case 'pi':   return piContrib(ms);
    case 'tax':  return birTax(ms);
    case '13th': return thirteenth(emp);
    default:     return 0;
  }
}

/* ---- GOVT NUMBER VALIDATION ---- */
const GOVT_FORMATS={
  sss: {digits:10,   label:'SSS',        hint:'12-3456789-0  (10 digits)',  mask:[2,7,1]},
  ph:  {digits:12,   label:'PhilHealth', hint:'12-345678901-2 (12 digits)', mask:[2,9,1]},
  pi:  {digits:12,   label:'Pag-IBIG',   hint:'1234-5678-9012 (12 digits)', mask:[4,4,4]},
  tin: {digits:[9,12],label:'TIN/BIR',   hint:'123-456-789-000 (9 or 12 digits)',mask:[3,3,3,3]},
};

/* Auto-format a raw string into the dashed govt number format */
function fmtGovt(key,raw){
  const digits=(raw||'').replace(/\D/g,'');
  const fmt=GOVT_FORMATS[key];if(!fmt)return raw;
  const mask=fmt.mask;
  const max=Array.isArray(fmt.digits)?Math.max(...fmt.digits):fmt.digits;
  const d=digits.slice(0,max);
  let out='',pos=0;
  for(let i=0;i<mask.length;i++){
    const chunk=d.slice(pos,pos+mask[i]);
    if(!chunk)break;
    if(i>0)out+='-';
    out+=chunk;
    pos+=mask[i];
  }
  return out;
}

/* Validate after formatting */
function validateGovtNum(key,value){
  if(!value||value==='—')return null;
  const fmt=GOVT_FORMATS[key];if(!fmt)return null;
  const digits=(value||'').replace(/\D/g,'');
  const allowed=Array.isArray(fmt.digits)?fmt.digits:[fmt.digits];
  if(!allowed.includes(digits.length)){
    return`${fmt.label} must have ${allowed.join(' or ')} digits. Format: ${fmt.hint}`;
  }
  return null;
}

/* RDO must remain text so numeric codes retain a leading zero (for example 043). */
function normalizeRdoCode(value){
  let code=String(value||'').toUpperCase().replace(/^RDO[\s-]*/,'').replace(/[^0-9A-Z]/g,'');
  if(/^\d{1,3}$/.test(code))return code.padStart(3,'0');
  if(/^\d{1,2}[A-Z]$/.test(code))return code.padStart(3,'0');
  return code.slice(0,3);
}

function validateGovtAll(e){
  return['sss','ph','pi','tin'].map(k=>validateGovtNum(k,e[k])).filter(Boolean);
}

/* ---- DUPLICATE DETECTION ---- */
function findDuplicates(candidate,excludeId){
  const others=USERS.filter(u=>u.id!==excludeId);
  const dupes=[];
  if(candidate.eid&&others.find(u=>u.eid===candidate.eid))
    dupes.push(`Employee ID "${candidate.eid}" already exists`);
  if(candidate.email&&others.find(u=>u.email===candidate.email))
    dupes.push(`Email "${candidate.email}" already exists`);
  ['sss','ph','pi','tin'].forEach(k=>{
    const v=(candidate[k]||'').replace(/\D/g,'');
    if(v.length>5&&others.find(u=>(u[k]||'').replace(/\D/g,'')===v))
      dupes.push(`${GOVT_FORMATS[k]?.label} number already exists on another employee`);
  });
  return dupes;
}

/* ---- OFFBOARDING AUTO-DEACTIVATION ---- */
/* Employment type classification constants */
const PROBATION_EVAL_TYPES=new Set(['probationary']); /* types that get 3rd/5th month + probation dates */
const NO_EVAL_TYPES=new Set(['contractual','project-based','part-time','consultant']); /* dates are N/A */
const LAST_WORK_DATE_TYPES=new Set(['contractual','project-based','part-time','consultant']); /* show Last Working Date */

function checkOffboarding(){
  const tod=today();
  let terminated=0,converted=0;
  USERS.forEach(u=>{
    /* Auto-convert probationary → regular when probation end date is reached */
    if(u.type==='probationary'&&u.probEndDate&&u.probEndDate<=tod){
      u.type='regular';u.status='active';converted++;
    }
    if(!u.effectiveTermDate)return;
    if(u.effectiveTermDate<=tod&&u.active!==false){
      u.active=false;u.status='terminated';u.projectedAttrition=false;terminated++;
    }else if(u.effectiveTermDate>tod&&u.terminationType&&u.terminationType!=='N/A'){
      u.projectedAttrition=true;u.active=true;
    }
  });
  if(terminated)gsLog(`Auto-deactivated ${terminated} employee(s) — termination date reached`,'info');
  if(converted)gsLog(`${converted} employee(s) automatically converted to Regular — probation period ended`,'info');
}

function shadeColor(hex,pct){
  const n=parseInt(hex.slice(1),16);
  const amt=Math.round(2.55*pct);
  const R=Math.min(255,Math.max(0,(n>>16)+amt));
  const G=Math.min(255,Math.max(0,((n>>8)&0x00FF)+amt));
  const B=Math.min(255,Math.max(0,(n&0x0000FF)+amt));
  return'#'+((1<<24)+(R<<16)+(G<<8)+B).toString(16).slice(1);
}
function hexToAlpha(hex,a){
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  return`rgba(${r},${g},${b},${a})`;
}

let GS={
  url:'',
  status:'disconnected',
  statusMsg:'',
  lastSync:null,
  autoSync:false,
  log:[],
  pushing:false,
  syncing:false,       /* background auto-sync in progress */

};

/* ---- AUTO-SYNC QUEUE (debounced, batched) ---- */
let _syncQueue=new Set();
let _syncTimer=null;

function queueSync(...sheets){
  if(window.queueDatabaseSave)window.queueDatabaseSave();
  if(!GS.autoSync||GS.status!=='connected')return;
  sheets.forEach(s=>_syncQueue.add(s));
  clearTimeout(_syncTimer);
  _syncTimer=setTimeout(flushSync,2500); /* 2.5s debounce — batches rapid changes */
}

async function flushSync(){
  if(!_syncQueue.size||GS.pushing)return;
  const sheets=[..._syncQueue];
  _syncQueue.clear();
  GS.syncing=true;GS.syncIndicator='syncing';render();
  const payload=buildSyncPayload();
  let ok=true;
  for(const s of sheets){
    if(payload[s]){
      try{
        const d=await gsCall(null,{action:'push',entity:s,data:payload[s],replace:true});
        if(!d.ok)throw new Error(d.error||'ok:false');
        gsLog('Auto-synced '+s+' ('+payload[s].length+' rows)','ok');
      }catch(e){gsLog('Auto-sync failed '+s+': '+e.message,'error');ok=false;}
    }
  }
  GS.syncing=false;
  GS.syncIndicator=ok?'ok':'error';
  GS.lastSync=ok?new Date().toISOString():GS.lastSync;
  render();
  /* Fade indicator back to normal after 3s */
  setTimeout(()=>{GS.syncIndicator='';render();},3000);
}

let ZK={
  devices:[],                // [{serial,lastSeen,pendingCount}] from the server

  pulledRecords:[],          // raw pending punches fetched from the server
  importPreview:[],          // mapped+deduped ready to import
  realtimeEnabled:false,

  connectionOverride:{address:'',port:'',https:false},

  punchBuffer:{beforeMinutes:120,afterMinutes:480},

function zkBuildPreview(){
  ZK.importPreview=[];
  ZK.pulledRecords.forEach(r=>{
    const empId=ZK.userMapping[r.userId];
    const emp=empId?USERS.find(u=>u.id===empId):null;
    ZK.importPreview.push({...r,empId,empName:emp?emp.name:'[Unmapped]',mapped:!!empId});
  });
  ZK.importPreview=ZK.importPreview.map(r=>{
    if(!r.empId||!r.date||!r.time)return{...r,duplicate:false};
    const existing=ATT.find(a=>a.eid===r.empId&&a.date===r.date);
    // Only skip as duplicate if this exact punch time is already covered by the
    // recorded tin/tout range — a new punch outside that range (e.g. the actual
    // check-out arriving after an earlier check-in was already imported) must
    // still go through so it can extend the record instead of being lost.
    const redundant=!!(existing&&existing.tin&&existing.tout&&r.time>=existing.tin&&r.time<=existing.tout);
    return{...r,duplicate:redundant};
  });
}
function zkMappableUsers(){
  const known=new Set(ZK.deviceUsers.map(du=>du.userId));
  const extra=[];
  ZK.pulledRecords.forEach(r=>{
    if(!known.has(r.userId)){known.add(r.userId);extra.push({userId:r.userId,name:'',cardNo:'',fromPunchesOnly:true});}
  });
  // Already-saved mappings must stay visible/editable even when the device is
  // offline or hasn't reported that user again this session.
  Object.keys(ZK.userMapping).forEach(userId=>{
    if(ZK.userMapping[userId]&&!known.has(userId)){known.add(userId);extra.push({userId,name:'',cardNo:'',fromPunchesOnly:true});}
  });
  return ZK.deviceUsers.concat(extra);
}
function zkSaveMapping(){
  const newMapping={};
  zkMappableUsers().forEach(du=>{
    const sel=document.getElementById('zkmap-'+du.userId);
    newMapping[du.userId]=sel&&sel.value?parseInt(sel.value):undefined;
  });
  // Warn when an employee ends up mapped to more than one device user ID —
  // their punches from every mapped ID get silently merged into one
  // attendance record per day, which can hide an accidental wrong mapping.
  const byEmp={};
  Object.keys(newMapping).forEach(uid=>{
    const empId=newMapping[uid];
    if(!empId)return;
    (byEmp[empId]=byEmp[empId]||[]).push(uid);
  });
  const conflicts=Object.keys(byEmp).filter(empId=>byEmp[empId].length>1);
  if(conflicts.length){
    const lines=conflicts.map(empId=>{
      const emp=USERS.find(u=>u.id===parseInt(empId));
      return `• ${emp?emp.name:'Employee #'+empId}: device user IDs ${byEmp[empId].join(', ')}`;
    }).join('\n');
    const proceed=confirm(`⚠ The following employee(s) are mapped to more than one device user ID. Punches from all their mapped IDs will be merged into a single attendance record per day.\n\n${lines}\n\nSave this mapping anyway?`);
    if(!proceed)return;
  }
  ZK.userMapping=newMapping;
  zkBuildPreview();
  render();
  alert('User mapping saved!');
}
// Mirrors server.js's zkPunchKind/zkPickInOut: trust the device's own in/out toggle
// (ATTLOG status code) when any punch that day has one, otherwise fall back to
// earliest-in/latest-out.
function zkPunchKind(statusCode){
  if(statusCode==='0'||statusCode==='4')return'in';
  if(statusCode==='1'||statusCode==='2'||statusCode==='3'||statusCode==='5')return'out';
  return null;
}
function zkPickInOut(entries){
  const ins=entries.filter(e=>e.kind==='in').map(e=>e.time).sort();
  const outs=entries.filter(e=>e.kind==='out').map(e=>e.time).sort();

async function zkImport(){
  const toImport=ZK.importPreview.filter(r=>r.mapped&&!r.duplicate&&r.date);
  // Group by empId+shift-day (not raw device date) → merge with any already-imported
  // tin/tout for that day, then pick in/out using the device's own toggle where available.
  const grouped={};
  const outOfBufferKeys=new Set();
  toImport.forEach(r=>{
    const emp=USERS.find(u=>u.id===r.empId);
    const hasShift=!!(emp&&emp.shiftId!=null);
    const resolvedDate=hasShift?TimekeepingCore.resolveShiftDay(emp,r.date,r.time,COMPANY.shifts||[],ZK.punchBuffer.beforeMinutes,ZK.punchBuffer.afterMinutes):r.date;
    const finalDate=resolvedDate||r.date;
    const key=`${r.empId}_${finalDate}`;
    if(!grouped[key]){
      const existing=attendanceRecord(r.empId,finalDate);
      grouped[key]={empId:r.empId,date:finalDate,entries:[
        existing&&existing.tin?{time:existing.tin,kind:'in'}:null,
        existing&&existing.tout?{time:existing.tout,kind:'out'}:null
      ].filter(Boolean)};
    }
    if(r.time)grouped[key].entries.push({time:r.time,kind:zkPunchKind(r.statusCode)});
    if(hasShift&&!resolvedDate)outOfBufferKeys.add(key);
  });
  let added=0,flaggedCount=0;
  Object.values(grouped).forEach(g=>{
    const{tin,tout}=zkPickInOut(g.entries);
    const isLate=tin>='08:30';
    const flagged=outOfBufferKeys.has(`${g.empId}_${g.date}`);
    if(flagged)flaggedCount++;
    upsertAttendance(g.empId,g.date,{tin,tout,status:isLate?'late':'present',ot:0,nd:0,notes:flagged?'ZKTeco import · Outside scheduled shift window — needs confirmation':'ZKTeco import',source:'zkteco-import',approvalStatus:flagged?'pending':'approved',filedBy:'ZKTeco import'});
    added++;
  });
  try{
    await zkApi('/ack',{method:'POST',body:JSON.stringify({consumed:toImport.map(r=>({serial:r.serial,userId:r.userId,date:r.date,time:r.time}))})});
  }catch(e){/* import already reflected locally; ack failure just means these may resurface on next pull */}
  alert(`Imported ${added} attendance record${added!==1?'s':''}. Duplicate/unmapped rows skipped.`+(flaggedCount?` ${flaggedCount} record${flaggedCount!==1?'s were':' was'} outside the employee's scheduled shift window and flagged for confirmation.`:''));
  ZK.pulledRecords=[];ZK.importPreview=[];
  render();
}
/* ---- Permission helper ----
   Two ways a user can be a full administrator: the legacy `role:'admin'` flag (an
   outsourced/service account, deliberately excluded from `role==='employee'` headcount
   filters), or `role:'employee'` combined with the "Super Admin" access level (id 1) — a
   staff member who is also a full admin, e.g. an in-house HR/payroll manager in SaaS mode.
   Every admin-only gate should go through this instead of checking `user.role==='admin'`
   directly, so both patterns work identically. */
function isAdminUser(u){
  return !!(u && (u.role==='admin' || u.accessLevelId===1));
}
function canAccess(viewKey){
  if(!user)return false;
  if(isAdminUser(user)||isPlatformAdmin)return true; /* admin + God Admin = full access */
  const al=ACCESS_LEVELS.find(a=>a.id===user.accessLevelId);
  if(!al)return false;
  return al.perms[viewKey]===true;
}

function mpfContrib(ms){

function phContrib(ms){
  /* PhilHealth 2025: 2.5% employee share, floor ₱10,000 → ₱250, ceiling ₱100,000 → ₱2,500 */
  const r=GOVT_RATES.philhealth;
  if(ms<=r.minSalary)return r.minContrib;
  if(ms>=r.maxSalary)return r.maxContrib;

  const r=GOVT_RATES.pagibig;
  const rate=ms<=r.lowRateThreshold?r.lowRatePercent:r.ratePercent;

  const nonTaxExtras=extras?extras.filter(x=>!x.taxable&&x.cat!=='deductions').reduce((s,x)=>s+x.amount,0):0;

/* ── Impersonation (God Mode) ── */
let godAdmin=null; /* stores the platform identity and context while impersonating */

function recordSecurityAudit(action,target,notes){
  SECURITY_AUDIT.push({id:nSecurityAudit++,action,targetUserId:target?.id||null,targetEmployeeNo:target?.eid||'',targetName:target?.name||'',clientId:activeClientId||null,by:'God Admin',at:new Date().toISOString(),notes:notes||''});
  queueSync('Security_Audit');
}

function openUserLogin(clientId){
  if(!isPlatformAdmin||godAdmin){toast('Only the active Super Admin session can use Log in as user.','warning');return;}
  enterClient(clientId);
  modal={type:'impersonatePicker',clientId};
  render();
}

function impersonateUser(id){
  if(!isPlatformAdmin||godAdmin){toast('Only Super Admin can start an impersonated session.','warning');return;}
  const target=USERS.find(u=>u.id===id);
  if(!target)return;
  if(target.active===false){toast('Disabled users cannot be impersonated.','warning');return;}
  if(!confirm(`Log in as ${target.name} (${target.eid||target.email})?\n\nYou will use this user's actual permissions. All impersonation activity is audited.`))return;
  godAdmin={user:user,wasPlatformAdmin:isPlatformAdmin,startedAt:new Date().toISOString(),clientId:activeClientId};
  recordSecurityAudit('impersonation_started',target,'Super Admin entered the account without using or revealing the user password.');
  isPlatformAdmin=false;
  user=target;
  view='dashboard';tab=0;modal=null;
  render();
}

function exitImpersonation(){
  if(!godAdmin)return;
  const impersonated=user;
  recordSecurityAudit('impersonation_ended',impersonated,'Session returned to Super Admin.');
  user=godAdmin.user;
  isPlatformAdmin=godAdmin.wasPlatformAdmin;
  godAdmin=null;
  view='employees';tab=0;modal=null;
  render();
}

/* ── Password Reset ── */
function applyPasswordReset(){
  const m=modal;
  if(m?.type!=='resetPassword')return;
  const newPass=(m.newPass||'').trim();
  if(!newPass){alert('Password cannot be empty.');return;}
  if(newPass.length<6){alert('Password must be at least 6 characters.');return;}
  const e=m.emp;
  if(!e)return;
  e.pass=newPass;
  closeM();
  alert(`✅ Password updated for ${e.name}.\n\nNew password: ${newPass}`);
  render();queueSync('Employees');
}
function goView(v){
  if(view==='webbundy'){stopBundyCam();}
  if(!canAccess(v)&&user.role!=='admin'){alert('You do not have access to this module.');return;}
  /* Reset statutory section collapsed state when switching tabs */
  if(v==='empdetail'&&view!=='empdetail')statCollapsed=STATUTORY_CONFIG.defaultCollapsed;
  view=v;tab=0;modal=null;aiText='';render();
  if(v==='zksetup')zkRefreshStatus();
}
function goTab(i){tab=i;render();}
function closeM(){modal=null;render();}

/* ═══════════════════════════════════════════════════════════
   SMART DUPLICATE DETECTION
   Scans all active employees for shared EID, biometric no.,
   SSS, PhilHealth, Pag-IBIG, and TIN/BIR numbers.
   Returns a Map: empId → [{field, label, conflictWith:[]}]
   ═══════════════════════════════════════════════════════════ */
function findAllDuplicates(){
  const checks=[
    {key:'eid',        label:'Employee ID'},
    {key:'biometricNo',label:'Biometric No.'},
    {key:'sss',        label:'SSS'},
    {key:'ph',         label:'PhilHealth'},
    {key:'pi',         label:'Pag-IBIG'},
    {key:'tin',        label:'TIN/BIR'},
  ];
  const active=USERS.filter(u=>u.role!=='admin');
  const result=new Map(); /* empId → [{field,label,conflictWith}] */

  checks.forEach(({key,label})=>{
    /* Build value → [employees] map, skipping blank values */
    const valMap={};
    active.forEach(e=>{
      const raw=String(e[key]||'').replace(/[\s\-]/g,'').toLowerCase();
      if(!raw)return;
      if(!valMap[raw])valMap[raw]=[];
      valMap[raw].push(e);
    });
    /* Any bucket with >1 employee is a conflict */
    Object.values(valMap).forEach(group=>{
      if(group.length<2)return;
      group.forEach(e=>{
        if(!result.has(e.id))result.set(e.id,[]);
        result.get(e.id).push({
          field:key,label,
          conflictWith:group.filter(x=>x.id!==e.id).map(x=>x.name),
        });
      });
    });
  });
  return result;
}

/* Fix for search input losing focus on render: call this after render() */
function refocusSearch(id){
  requestAnimationFrame(()=>{
    const el=document.getElementById(id);
    if(el){const v=el.value.length;el.focus();el.setSelectionRange(v,v);}
  });
}

/* ─── Multi-employee search ───────────────────────────────
   Splits on newlines (Excel paste), tabs, commas, semicolons.
   Each resulting chunk is a separate search term.
   An employee matches if ANY term is found in their fields.
   ───────────────────────────────────────────────────────── */
function tokenizeSearch(query){
  if(!query?.trim())return[];
  // Split on newlines/tabs/commas/semicolons — covers Excel copy-paste and manual entry
  return query.split(/[\n\r\t,;]+/).map(t=>t.trim()).filter(Boolean);
}

function filterEmps(emps,query){
  if(!query?.trim())return emps;
  const terms=tokenizeSearch(query).map(t=>t.toLowerCase());
  if(!terms.length)return emps;
  return emps.filter(e=>{
    const hay=[e.name,e.eid,e.pos,e.dept,e.bu,e.team,e.email,e.bandLevel,e.type,e.status,e.firstName,e.lastName,e.city].join('|').toLowerCase();
    return terms.some(t=>hay.includes(t));
  });
}

function onSearchPaste(event){
  event.preventDefault();
  const raw=(event.clipboardData||window.clipboardData).getData('text');
  const el=event.target;
  const s=el.selectionStart||0,e2=el.selectionEnd||0;
  const newVal=empSearch.slice(0,s)+raw+empSearch.slice(e2);
  setEmpSearch(newVal);
}

function setEmpSearch(val){empSearch=val;render();refocusSearch('emp-search-input');}

function pgEmployees(){
  const allEmps=USERS.filter(u=>u.role==='employee');
  const emps=filterEmps(allEmps,empSearch);
  const tabs=['All Employees','Org Chart','Bulk Upload','Bulk Update'];
  if(tab===1){
    const active=allEmps.filter(e=>e.active!==false);

    /* ── Build reporting tree from immediateHeadEid ── */
    const activeEids=new Set(active.map(e=>e.eid));

    /* Map: managerEid → [direct reports] */
    const reports={};
    active.forEach(e=>{
      const hEid=e.immediateHeadEid;
      if(hEid&&activeEids.has(hEid)){
        if(!reports[hEid])reports[hEid]=[];
        reports[hEid].push(e);
      }
    });

    /* Roots = employees whose immediate head is unset or not in active list */
    const roots=active.filter(e=>!e.immediateHeadEid||!activeEids.has(e.immediateHeadEid));

    /* Detect orphans (employees in a cycle — safety guard) */
    const inTree=new Set();
    const markTree=(eid)=>{
      if(inTree.has(eid))return;
      inTree.add(eid);
      (reports[eid]||[]).forEach(r=>markTree(r.eid));
    };
    roots.forEach(r=>markTree(r.eid));
    const orphans=active.filter(e=>!inTree.has(e.eid));

    /* ── Employee card ── */
    const empCard=(e,isRoot=false)=>{
      const bc=getBandColor(e.bandLevel);
      const numReports=(reports[e.eid]||[]).length;
      return`<div onclick="openEmp(${e.id})"
        style="cursor:pointer;padding:10px 12px;border:${isRoot?'2px solid var(--accent)':'1px solid var(--border)'};
          border-radius:10px;background:${isRoot?'var(--accent-bg)':'var(--bg)'};
          min-width:140px;max-width:175px;text-align:center;transition:box-shadow .15s"
        onmouseover="this.style.boxShadow='0 3px 10px rgba(0,0,0,.12)'"
        onmouseout="this.style.boxShadow=''">
        <div class="avatar ${isRoot?'lg':'sm'}" style="margin:0 auto 6px">${ini(e.name)}</div>
        <div style="font-weight:700;font-size:12px;line-height:1.3;color:${isRoot?'var(--accent-txt)':'var(--txt)'}">${esc(e.name)}</div>
        <div style="font-size:10px;color:var(--txt3);margin-top:2px">${esc(e.pos||'')}</div>
        <div style="display:flex;justify-content:center;gap:4px;margin-top:5px;flex-wrap:wrap">
          ${e.bandLevel?`<span style="font-size:9px;font-weight:700;padding:1px 6px;border-radius:4px;background:${bc.bg};color:${bc.txt}">${esc(e.bandLevel)}</span>`:''}
          ${numReports?`<span style="font-size:9px;padding:1px 6px;border-radius:4px;background:var(--bg);border:1px solid var(--border);color:var(--txt3)">${numReports} report${numReports!==1?'s':''}</span>`:''}
        </div>
      </div>`;
    };

    /* ── Recursive tree renderer ── */
    const renderTree=(emp,depth=0)=>{
      const children=(reports[emp.eid]||[]).slice().sort((a,b)=>(reports[b.eid]||[]).length-(reports[a.eid]||[]).length);
      const hasChildren=children.length>0;
      return`<div style="display:flex;flex-direction:column;align-items:center;min-width:${depth===0?'160px':'140px'}">
        ${empCard(emp,depth===0)}
        ${hasChildren?`
          <!-- connector line down -->
          <div style="width:2px;height:16px;background:var(--border)"></div>
          <!-- horizontal bar spanning children -->
          <div style="position:relative;display:flex;gap:16px;align-items:flex-start;justify-content:center">
            ${children.length>1?`<div style="position:absolute;top:0;left:calc(50% - ${(children.length-1)*8}%);right:calc(50% - ${(children.length-1)*8}%);height:2px;background:var(--border)"></div>`:''}
            ${children.map(child=>`
              <div style="display:flex;flex-direction:column;align-items:center">
                <div style="width:2px;height:16px;background:var(--border)"></div>
                ${renderTree(child,depth+1)}
              </div>`).join('')}
          </div>`:''}
      </div>`;
    };

    return`<div class="page-header">
      <div><div class="page-title">Org Chart</div>
      <div class="page-sub">${active.length} active · ${roots.length} root${roots.length!==1?'s':''} · based on Immediate Head chain</div></div>
    </div>
    <div class="tabs">${tabs.map((t,i)=>`<div class="tab${tab===i?' active':''}" onclick="goTab(${i})">${t}</div>`).join('')}</div>

    ${!roots.length?`<div class="card" style="text-align:center;padding:2rem;color:var(--txt3)">
      No reporting chain configured yet. Assign Immediate Heads in each employee's Employment tab.
    </div>`:`<div class="card" style="overflow-x:auto;padding:1.5rem">
      <div style="display:flex;gap:3rem;flex-wrap:wrap;justify-content:flex-start;min-width:max-content">
        ${roots.map(r=>renderTree(r,0)).join('')}
      </div>
    </div>`}

    ${orphans.length?`<div class="card" style="margin-top:1rem">
      <div style="font-size:13px;font-weight:600;color:var(--txt3);margin-bottom:8px">⚠ Not in any reporting chain (${orphans.length})</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        ${orphans.map(e=>empCard(e,false)).join('')}
      </div>
    </div>`:''}`;
  }
  if(tab===2){
    const reqFields=getBulkRequiredFields();
    const res=bulkResults;
    const colMap=bulkColMap;
    const readyCount=res?res.filter(r=>r.ok).length:0;
    const warnCount=res?res.filter(r=>!r.ok&&r.errors.length===0).length:0;
    const errCount=res?res.filter(r=>r.errors.length>0).length:0;

    /* Step indicator */
    const step=colMap?2:res?3:1;
    const stepBar=`<div style="display:flex;align-items:center;gap:0;margin-bottom:1.25rem">
      ${[{n:1,l:'Download & Prepare'},{n:2,l:'Map Columns'},{n:3,l:'Review & Import'}].map((s,si)=>`
      <div style="display:flex;align-items:center;gap:0;flex:1">
        <div style="display:flex;align-items:center;gap:6px;white-space:nowrap">
          <div style="width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;
            background:${step>s.n?'var(--green)':step===s.n?'var(--accent)':'var(--border)'};
            color:${step>=s.n?'#fff':'var(--txt3)'}">
            ${step>s.n?'✓':s.n}</div>
          <span style="font-size:12px;font-weight:${step===s.n?'600':'400'};color:${step===s.n?'var(--txt)':'var(--txt3)'}">${s.l}</span>
        </div>
        ${si<2?`<div style="flex:1;height:1px;background:var(--border);margin:0 10px"></div>`:''}
      </div>`).join('')}
    </div>`;

    /* ── STEP 3: Review & Import ── */
    if(res){
      /* Editable cell helpers */
      const txtInput=(i,k,v,w,forceErr=false)=>{
        const isReq=!v&&getBulkRequiredFields().find(f=>f.key===k);
        /* Highlight red if value is in an error message for this row */
        const rowErrs=(bulkResults[i]?.errors||[]).join(' ').toLowerCase();
        const hasConflict=forceErr||(k==='email'&&rowErrs.includes('email'))||(k==='eid'&&rowErrs.includes('employee id'));
        return`<input type="text" value="${esc(v||'')}" 
          style="border:1.5px solid ${isReq||hasConflict?'var(--red)':'var(--border)'};border-radius:4px;padding:3px 6px;font-size:12px;width:${w||'100%'};background:${hasConflict?'#fff1f1':'var(--bg)'};color:var(--txt)"
          title="${hasConflict?'⚠ Conflict — edit this value to fix the error':''}"
          oninput="bulkResults[${i}].row['${k}']=this.value"
          onblur="revalidateBulkRow(${i});updateBulkRowDOM(${i})"/>`;
      };
      const selInput=(i,k,v,opts)=>`<select 
        style="border:1px solid ${!v?'var(--red)':'var(--border)'};border-radius:4px;padding:3px 6px;font-size:12px;width:100%;background:var(--bg);color:var(--txt)"
        onchange="bulkResults[${i}].row['${k}']=this.value;revalidateBulkRow(${i});updateBulkRowDOM(${i})">
        <option value="">— select —</option>
        ${opts.map(o=>`<option value="${esc(o)}" ${v===o?'selected':''}>${esc(o)}</option>`).join('')}
      </select>`;
      const typeOpts=LOOKUPS.employmentTypes.map(t=>t.code);

      return`<div class="page-header"><div class="page-title">Employees</div></div>
      <div class="tabs">${tabs.map((t,i)=>`<div class="tab${tab===i?' active':''}" onclick="goTab(${i})">${t}</div>`).join('')}</div>
      ${stepBar}
      <div class="card">
        <!-- Summary + actions -->
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:1rem">
          <div id="bulk-pill-ok" style="padding:5px 12px;border-radius:999px;background:var(--green-bg);color:var(--green-txt);font-weight:700;font-size:13px">✅ ${readyCount} ready</div>
          <div id="bulk-pill-warn" style="padding:5px 12px;border-radius:999px;background:var(--amber-bg);color:var(--amber-txt);font-weight:700;font-size:13px;${warnCount?'':'display:none'}">⚠ ${warnCount} warnings</div>
          <div id="bulk-pill-err" style="padding:5px 12px;border-radius:999px;background:var(--red-bg);color:var(--red-txt);font-weight:700;font-size:13px;${errCount?'':'display:none'}">❌ ${errCount} errors</div>
          <div style="flex:1"></div>
          <button class="btn" onclick="bulkResults=null;bulkColMap=null;render()">← New File</button>
          <button id="bulk-import-btn" class="btn btn-primary" ${readyCount+warnCount===0?'disabled':''} onclick="confirmBulkUpload(bulkResults)">
            ⬆ Import ${readyCount+warnCount} valid rows
          </button>
        </div>
        ${errCount?`<div style="padding:8px 12px;background:var(--accent-bg);border-radius:7px;font-size:12px;color:var(--accent-txt);margin-bottom:10px">
          💡 Edit any cell directly in the table below. <strong>Red fields have conflicts</strong> — click and update the value, then tab out to re-validate.
        </div>`:''}
        <!-- Inline-editable table -->
        <div style="overflow-x:auto">
          <table style="font-size:12px;min-width:900px">
            <thead><tr>
              <th style="width:30px">#</th>
              <th style="width:40px"></th>
              <th style="min-width:100px">Emp ID</th>
              <th>First Name</th><th>Last Name</th><th>Email</th>
              <th style="min-width:90px">Password</th>
              <th>Position</th>
              <th style="min-width:110px">Type</th>
              <th style="min-width:110px">Start Date</th>
              <th style="min-width:200px">Issues</th>
            </tr></thead>
            <tbody id="bulk-tbody">
            ${res.map((r,i)=>`
              <tr id="bulk-row-${i}" style="background:${r.errors.length?'#fff1f1':r.warnings.length?'#fffbf0':''}">
                <td style="color:var(--txt3);font-size:11px">${i+1}</td>
                <td id="bulk-status-${i}">${r.errors.length?'<span class="badge b-absent" style="font-size:11px">✗</span>':r.warnings.length?'<span class="badge b-warning" style="font-size:11px">!</span>':'<span class="badge b-approved" style="font-size:11px">✓</span>'}</td>
                <td>${txtInput(i,'eid',r.row.eid,'90px')}</td>
                <td>${txtInput(i,'firstName',r.row.firstName)}</td>
                <td>${txtInput(i,'lastName',r.row.lastName)}</td>
                <td>${txtInput(i,'email',r.row.email)}</td>
                <td>${txtInput(i,'pass',r.row.pass,'90px')}</td>
                <td>${txtInput(i,'pos',r.row.pos)}</td>
                <td>${selInput(i,'type',r.row.type,typeOpts)}</td>
                <td>${txtInput(i,'hired',r.row.hired,'100px')}</td>
                <td id="bulk-issues-${i}" style="vertical-align:top;font-size:11px">
                  ${r.errors.map(e=>`<div style="color:var(--red-txt);padding:1px 0">❌ ${esc(e)}</div>`).join('')}
                  ${r.warnings.map(w=>`<div style="color:var(--amber-txt);padding:1px 0">⚠ ${esc(w)}</div>`).join('')}
                </td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
      </div>`;
    }

    /* ── STEP 2: Column Mapping ── */
    if(colMap){
      const sysFields=[{k:'',l:'— Skip this column —'},...getBulkRequiredFields().map(f=>({k:f.key,l:`* ${f.label}`})),
        ...['middleName','suffix','personalEmail','contact','bday','gender','maritalStatus','city','permanentAddress',
          'eid','bu','dept','team','subteam','bandLevel','costCenter','probEndDate','entityName',
          'loanEligibility','includeInPayroll','includeInTimekeeping','currency','payType','mobileAllowance','riceAllowance',
          'sss','ph','pi','tin','bank','bankAccount','ec1Name','ec1Rel','ec1Contact','ec2Name','ec2Rel','ec2Contact'
        ].map(k=>({k,l:k}))];
      return`<div class="page-header"><div class="page-title">Employees</div></div>
      <div class="tabs">${tabs.map((t,i)=>`<div class="tab${tab===i?' active':''}" onclick="goTab(${i})">${t}</div>`).join('')}</div>
      ${stepBar}
      <div class="card">
        <div class="card-title" style="margin-bottom:4px">Map Your Columns</div>
        <div style="font-size:13px;color:var(--txt3);margin-bottom:1rem">
          Your file has columns that don't match the system fields exactly. Map each column to the right field, or skip it.
        </div>
        <div style="overflow-x:auto"><table>
          <thead><tr><th>Your Column</th><th>Sample Value</th><th>Map to System Field</th></tr></thead>
          <tbody>
          ${Object.entries(colMap.map).map(([col,mapped])=>`<tr>
            <td style="font-family:'JetBrains Mono',monospace;font-size:12px">${esc(col)}</td>
            <td style="color:var(--txt3);font-size:12px">${esc(colMap.sample[col]||'')}</td>
            <td><select class="finput" style="font-size:12px" onchange="bulkColMap.map['${esc(col)}']=this.value">
              ${sysFields.map(sf=>`<option value="${sf.k}" ${mapped===sf.k?'selected':''}>${esc(sf.l)}</option>`).join('')}
            </select></td>
          </tr>`).join('')}
          </tbody>
        </table></div>
        <div style="display:flex;gap:8px;margin-top:1rem">
          <button class="btn btn-primary" onclick="applyBulkColMap()">Apply Mapping & Validate →</button>
          <button class="btn" onclick="bulkColMap=null;bulkResults=null;render()">← Start Over</button>
        </div>
      </div>`;
    }

    /* ── STEP 1: Download & Upload ── */
    return`<div class="page-header"><div class="page-title">Employees</div></div>
    <div class="tabs">${tabs.map((t,i)=>`<div class="tab${tab===i?' active':''}" onclick="goTab(${i})">${t}</div>`).join('')}</div>
    ${stepBar}
    <div style="display:grid;grid-template-columns:300px 1fr;gap:1rem;align-items:start">
      <!-- LEFT: Guide -->
      <div>
        <div class="card">
          <div class="card-title" style="margin-bottom:.875rem">📋 How it works</div>
          <div style="display:grid;gap:10px">
            ${[
              {n:'1',t:'Download the Excel template',d:'Has real dropdowns for all selection fields. Required columns are marked *.'},
              {n:'2',t:'Fill in the data',d:'One employee per row. Dropdown cells prevent invalid values. Delete the sample row.'},
              {n:'3',t:'Upload & auto-validate',d:'System checks every row. Errors shown per-row — nothing saves until you confirm.'},
              {n:'4',t:'Fix & Import',d:'Click ✎ Fix on any error row to correct it directly in the browser. Then import.'},
            ].map(s=>`<div style="display:flex;gap:10px;align-items:flex-start">
              <div style="width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px">${s.n}</div>
              <div><div style="font-weight:600;font-size:13px">${s.t}</div><div style="font-size:12px;color:var(--txt3);margin-top:2px">${s.d}</div></div>
            </div>`).join('')}
          </div>
        </div>
        <div class="card" style="margin-top:.75rem">
          <div class="card-title" style="margin-bottom:.75rem">✳ Required Fields</div>
          <div style="display:grid;gap:3px">
            ${reqFields.map(f=>`<div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--border);font-size:12px">
              <span style="font-weight:500">${esc(f.label)}</span>
              <span style="font-size:11px;color:var(--txt3)">${esc(f.hint||'')}</span>
            </div>`).join('')}
          </div>
        </div>
      </div>
      <!-- RIGHT: Download + Upload -->
      <div>
        <div class="card" style="margin-bottom:.75rem">
          <div class="card-title" style="margin-bottom:.5rem">Step 1 — Download Template</div>
          <div style="font-size:12px;color:var(--txt3);margin-bottom:.875rem">The template has <strong>5 sheets</strong> — one per employee tab. Each sheet has dropdown lists built in for all selection fields. Just fill in the data, then upload.</div>
          <button class="btn btn-primary" style="width:100%;padding:12px;font-size:14px;justify-content:center" onclick="downloadTemplateXLSX()">
            📊 Download Excel Template (.xlsx)
          </button>
          <div style="margin-top:8px;font-size:11px;color:var(--txt3);text-align:center">Works with Excel, Google Sheets, LibreOffice</div>
        </div>
          <div class="card">
          <div class="card-title" style="margin-bottom:.5rem">Step 2 — Fill &amp; Upload</div>
          <div style="font-size:12px;color:var(--txt3);margin-bottom:.875rem">Fill in the sheets, then click below to upload. The system validates every row before importing anything.</div>
          <!-- Upload zone: label+for — native browser file dialog, works everywhere -->
          <input type="file" id="nh-upload" accept=".xlsx,.xls"
            style="position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;opacity:0"
            onchange="handleBulkUpload(event)"/>
          <label for="nh-upload"
            style="display:block;border:2px dashed var(--border);border-radius:10px;padding:1.5rem;text-align:center;color:var(--txt3);cursor:pointer;transition:border-color .2s,background .2s"
            onmouseover="this.style.borderColor='var(--accent)';this.style.background='var(--accent-bg)'"
            onmouseout="this.style.borderColor='var(--border)';this.style.background=''">
            <div style="font-size:32px;margin-bottom:6px">📂</div>
            <div style="font-size:14px;font-weight:600;color:var(--txt)">Click to select file</div>
            <div style="font-size:12px;margin-top:4px">Excel files (.xlsx or .xls)</div>
          </label>
          <label for="nh-upload" class="btn btn-primary"
            style="display:flex;justify-content:center;margin-top:8px;padding:10px;font-size:13px;cursor:pointer;width:100%;box-sizing:border-box">
            📂 Browse &amp; Upload File
          </label>
        </div>
      </div>
    </div>`;
  }
  /* ── TAB 3: Bulk Update ── */
  if(tab===3){
    const upRes=bulkUpdateResults;
    const step=upRes?2:1;
    const stepBar=`<div style="display:flex;align-items:center;gap:0;margin-bottom:1.25rem">
      ${[{n:1,l:'Download & Edit'},{n:2,l:'Review & Apply'}].map((s,si)=>`
      <div style="display:flex;align-items:center;gap:0;flex:1">
        <div style="display:flex;align-items:center;gap:6px;white-space:nowrap">
          <div style="width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;
            background:${step>s.n?'var(--green)':step===s.n?'var(--accent)':'var(--border)'};
            color:${step>=s.n?'#fff':'var(--txt3)'}">
            ${step>s.n?'✓':s.n}</div>
          <span style="font-size:12px;font-weight:${step===s.n?'600':'400'};color:${step===s.n?'var(--txt)':'var(--txt3)'}">${s.l}</span>
        </div>
        ${si<1?`<div style="flex:1;height:1px;background:var(--border);margin:0 10px"></div>`:''}
      </div>`).join('')}
    </div>`;

    /* ── Step 2: Review ── */
    if(upRes){
      const changed=upRes.filter(r=>r.changes.length>0);
      const noChange=upRes.filter(r=>r.changes.length===0);
      const errors=upRes.filter(r=>r.errors.length>0);
      const movCount=upRes.filter(r=>r.movChanges?.length>0).length;
      return`<div class="page-header"><div class="page-title">Employees</div></div>
      <div class="tabs">${tabs.map((t,i)=>`<div class="tab${tab===i?' active':''}" onclick="goTab(${i})">${t}</div>`).join('')}</div>
      ${stepBar}
      <div class="card">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:1rem">
          <div style="padding:5px 12px;border-radius:999px;background:var(--green-bg);color:var(--green-txt);font-weight:700;font-size:13px">${changed.length} with changes</div>
          ${movCount?`<div style="padding:5px 12px;border-radius:999px;background:var(--accent-bg);color:var(--accent-txt);font-weight:700;font-size:13px">📋 ${movCount} movement records</div>`:''}
          ${errors.length?`<div style="padding:5px 12px;border-radius:999px;background:var(--red-bg);color:var(--red-txt);font-weight:700;font-size:13px">❌ ${errors.length} errors</div>`:''}
          <div style="padding:5px 12px;border-radius:999px;background:var(--bg);color:var(--txt3);font-size:12px">${noChange.length} unchanged</div>
          <div style="flex:1"></div>
          <button class="btn" onclick="bulkUpdateResults=null;render()">← New File</button>
          <button class="btn btn-primary" ${!changed.length||errors.filter(r=>r.errors.length>0).length?'disabled':''} onclick="applyBulkUpdate()">
            ✓ Apply ${changed.length} Update${changed.length!==1?'s':''}
          </button>
        </div>
        ${movCount?`<div style="padding:8px 12px;background:var(--accent-bg);border-radius:7px;font-size:12px;color:var(--accent-txt);margin-bottom:10px">
          💡 ${movCount} employee${movCount!==1?'s':''} have movement-tracked changes (Position, Band Level, Org, or Salary). Fill in the <strong>Effective Date</strong> and <strong>Reason</strong> columns — these are required to create movement records.
        </div>`:''}
        ${!changed.length?`<div style="padding:12px 14px;background:var(--amber-bg);border-radius:8px;font-size:13px;color:var(--amber-txt);margin-bottom:10px;border:1px solid var(--amber)">

/* Returns ordered list of required fields for validation and display */
function getBulkRequiredFields(){
  const req=[
    {key:'firstName',label:'First Name',tab:'Personal',hint:'Legal first name'},
    {key:'lastName', label:'Last Name', tab:'Personal',hint:'Legal last name'},
    {key:'email',    label:'Company Email',tab:'Personal',hint:'Unique, e.g. juan@co.com'},
    {key:'pass',     label:'Password',tab:'Personal',hint:'Login password'},
    {key:'pos',      label:'Position',tab:'Employment',hint:'Job title'},
    {key:'type',     label:'Employment Type',tab:'Employment',hint:LOOKUPS.employmentTypes.map(t=>t.code).join(' | ')},
    {key:'hired',    label:'Start Date',tab:'Employment',hint:'MM/DD/YYYY'},
    {key:'salaryPM', label:'Salary Per Month',tab:'Compensation',hint:'Number, e.g. 20000'},
  ];
  /* Append any FIELD_CONFIG required fields not already listed */
  ['personal','employment','compensation'].forEach(tk=>{
    Object.entries(FIELD_CONFIG[tk].required||{}).forEach(([k,isR])=>{
      if(isR&&!req.find(r=>r.key===k)){
        const def=DEFAULT_FIELDS[tk].find(f=>f.key===k);
        if(def)req.push({key:k,label:def.label,tab:tk,hint:''});
      }
    });
    (FIELD_CONFIG[tk].custom||[]).filter(f=>f.required).forEach(f=>{
      if(!req.find(r=>r.key===f.key))
        req.push({key:f.key,label:f.label,tab:tk,hint:f.description||''});
    });
  });
  return req;
}

/* ── Date normaliser: accepts MM/DD/YYYY, YYYY-MM-DD, or Excel serial ── */
function normaliseDate(v){
  if(!v&&v!==0)return'';
  const s=String(v).trim();
  if(!s)return'';
  /* Excel date serial (e.g. 45000) */
  if(/^\d{4,5}$/.test(s)){
    const d=new Date((parseInt(s)-25569)*86400*1000);
    if(!isNaN(d))return d.toISOString().slice(0,10);
  }
  /* MM/DD/YYYY or M/D/YYYY */
  const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(m)return`${m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;
  /* Already YYYY-MM-DD */
  if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
  /* DD-Mon-YYYY e.g. 15-Jun-2025 */
  const months={jan:'01',feb:'02',mar:'03',apr:'04',may:'05',jun:'06',jul:'07',aug:'08',sep:'09',oct:'10',nov:'11',dec:'12'};
  const m2=s.match(/^(\d{1,2})-([A-Za-z]{3})-(\d{4})$/);
  if(m2&&months[m2[2].toLowerCase()])return`${m2[3]}-${months[m2[2].toLowerCase()]}-${m2[1].padStart(2,'0')}`;
  return s;
}

function validateBulkRow(row,idx,usedEmails,usedEids){
  const errors=[],warnings=[];
  /* Normalise dates before validation */
  ['hired','bday','lastWorkDate','effectiveTermDate'].forEach(k=>{
    if(row[k])row[k]=normaliseDate(row[k]);
  });
  /* Required field check */
  getBulkRequiredFields().forEach(f=>{
    const v=row[f.key];
    if(!v||String(v).trim()==='')errors.push(`"${f.label}" is required`);
  });
  /* Email format + duplicate */
  if(row.email){
    const em=String(row.email).trim().toLowerCase();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){
      errors.push(`Email format invalid: "${row.email}"`);
    }else{
      const existing=USERS.find(u=>u.email.toLowerCase()===em);
      if(existing){
        errors.push(`Email "${row.email}" already belongs to ${existing.name} (${existing.eid}) — use Bulk Update to modify an existing employee`);
      }else if(usedEmails.has(em)){
        errors.push(`Duplicate email within this file: "${row.email}" — each employee needs a unique email`);
      }else{usedEmails.add(em);}
    }
  }
  /* EID duplicate + format notification */
  if(row.eid&&String(row.eid).trim()){
    const eid=String(row.eid).trim();
    const existing=USERS.find(u=>u.eid===eid);
    if(existing){
      errors.push(`Employee ID "${eid}" already belongs to ${existing.name} — use Bulk Update to modify an existing employee, or leave EID blank to auto-generate a new one`);
    }else if(usedEids.has(eid)){
      errors.push(`Duplicate Employee ID within this file: "${eid}"`);
    }else usedEids.add(eid);
  }
  /* Biometric number notification */
  if(row.biometricNo&&String(row.biometricNo).trim()){
    const bn=String(row.biometricNo).trim();
    if(!/^\d+$/.test(bn))warnings.push(`Biometric No. "${bn}" — should be digits only`);
  }
  /* Numeric salary */
  if(row.salaryPM&&isNaN(parseFloat(row.salaryPM)))errors.push('"Salary Per Month" must be a number');
  ['mobileAllowance','riceAllowance'].forEach(k=>{
    if(row[k]&&isNaN(parseFloat(row[k])))warnings.push(`"${k}" should be a number (got "${row[k]}")`);
  });
  /* Date validation — after normalisation */
  ['hired','bday'].forEach(k=>{
    if(row[k]&&String(row[k]).trim()){
      if(!/^\d{4}-\d{2}-\d{2}$/.test(String(row[k]).trim()))
        warnings.push(`${k}: unrecognised date format "${row[k]}" — use MM/DD/YYYY`);
    }
  });
  /* Employment type */
  if(row.type){
    const valid=LOOKUPS.employmentTypes.map(t=>t.code);
    if(!valid.includes(String(row.type).trim()))
      warnings.push(`Employment type "${row.type}" unrecognized. Valid: ${valid.join(', ')}`);
  }
  /* Govt number validation + auto-format with digit count notification */
  const govtSpec={sss:{digits:10,label:'SSS',fmt:'XX-XXXXXXX-X'},ph:{digits:12,label:'PhilHealth',fmt:'XX-XXXXXXXXX-X'},pi:{digits:12,label:'Pag-IBIG',fmt:'XXXX-XXXX-XXXX'},tin:{digits:12,label:'TIN/BIR',fmt:'XXX-XXX-XXX-XXX'}};
  const formatted={};
  Object.entries(govtSpec).forEach(([k,spec])=>{
    if(row[k]&&String(row[k]).trim()){
      const raw=String(row[k]).replace(/\D/g,'');
      if(raw.length!==spec.digits)warnings.push(`${spec.label}: expected ${spec.digits} digits, got ${raw.length} (format: ${spec.fmt})`);
      const err=validateGovtNum(k,String(row[k]).trim());
      if(err)warnings.push(err);
      formatted[k]=fmtGovt(k,String(row[k]));
    }
  });
  /* Custom required field check */
  ['personal','employment','compensation'].forEach(tk=>{
    (FIELD_CONFIG[tk].custom||[]).filter(f=>f.required).forEach(f=>{
      if(!row[f.key]||String(row[f.key]).trim()==='')
        errors.push(`Custom field "${f.label}" is required`);
    });
  });
  return{ok:errors.length===0,errors,warnings,formatted,row};
}

/* ── Build one Excel template sheet — clean 3-row header, no confusing markers ── */
function buildXLSXTemplateSheet(def){
  const cols=def.cols;
  /* Row 1: Plain instruction banner in the first cell (parser skips rows starting with ⚠) */
  const instrRow=[
    `⚠ ${def.note}  ·  Columns marked * are required  ·  Enter employee data from Row 3 onward`,
    ...cols.map(()=>''),
  ];
  /* Row 2: Column headers — clear human labels, * = required
     This is what the parser reads to map columns to field keys */
  const headerRow=cols.map(c=>c.l);
  /* Row 3: Example data row. First cell clearly says to delete this row.
     Parser skips any row whose first cell starts with "EXAMPLE" */
  const exampleRow=[
    `EXAMPLE — delete this row before uploading →`,
    ...cols.slice(1).map(c=>c.s??''),
  ];
  /* Override first data cell with sample too */
  exampleRow[0]=`EXAMPLE — delete before uploading`;
  if(cols[0])exampleRow[0]=`EXAMPLE — ${cols[0].s||'delete this row'}`;

  /* Data validation — dropdowns from Row 4 onward (after instruction + headers + example) */
  const dv=cols.flatMap((c,i)=>{
    if(!c.dv?.length)return[];
    const col=_colLetter(i); /* col 0 = A */
    const joined=c.dv.join(',');
    if(joined.length>250)return[];
    return[{type:'list',sqref:`${col}4:${col}10000`,
      formula1:`"${joined}"`,error:`Please select one of: ${c.dv.slice(0,5).join(', ')}`}];
  });

  const colWidths=cols.map(c=>Math.min(32,Math.max(14,(c.l||'').replace(/^\* /,'').length+4)));
  return{name:def.name,rows:[instrRow,headerRow,exampleRow],dataValidation:dv,colWidths};
}

/* ── Parse one Excel sheet into an array of row-objects ── */
function parseSheetToRows(ws){
  const rawRows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
  let keys=null;
  const dataRows=[];
  for(const row of rawRows){
    const first=String(row[0]||'').trim();
    /* Skip instruction banners */
    if(first.startsWith('⚠')||first.toUpperCase().startsWith('INSTRUCTION'))continue;
    /* Skip example/sample rows */
    if(first.toUpperCase().startsWith('EXAMPLE')||first.toUpperCase().startsWith('SAMPLE')||
       first.startsWith('[SAMPLE'))continue;
    /* Old-format [KEYS] support — backwards compatibility */
    if(first==='[KEYS]'){keys=row.slice(1).map(k=>String(k).trim());continue;}
    /* Skip other old-format markers */
    if(/^\[[A-Z]/.test(first)||first.startsWith('📋'))continue;
    /* Stop at reference section */
    if(first.startsWith('===')||first.toLowerCase().startsWith('valid values')||
       first.toLowerCase().startsWith('format rules'))break;
    /* Skip all-empty rows */
    if(row.every(c=>!c))continue;
    /* If no keys yet, this must be the human-label header row — map to field keys */
    if(!keys){
      const mapped=row.map(cell=>mapLabelToKey(String(cell)));
      if(mapped.some(k=>k)){keys=mapped;continue;}
      /* Fallback: check if it looks like camelCase keys directly */
      if(row.some(c=>String(c).match(/^[a-z][a-zA-Z0-9]+$/))){
        keys=row.map(c=>String(c||'').trim());continue;
      }
    }
    if(keys)dataRows.push(row);
  }
  if(!keys||!dataRows.length)return[];
  return dataRows.map(cells=>
    Object.fromEntries(
      keys.map((k,i)=>[k,String(cells[i]||'').trim()]).filter(([k])=>k)
    )
  );
}

/* ── Unified upload handler — Excel only (.xlsx and .xls) ── */
function handleBulkUpload(evt){
  const file=evt.target.files[0];if(!file)return;

  loadXLSXLib(()=>parseExcelUpload(file));
}
