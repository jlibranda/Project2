/* ── Toast notifications ── */
var TOAST_MAX = 3;
function toast(msg, type, dur) {
  type = type || 'info'; dur = dur || 3500;
  var wrap = document.getElementById('toast-wrap');
  if (!wrap) {
    wrap = document.createElement('div');
    wrap.id = 'toast-wrap';
    wrap.style.cssText = 'position:fixed;bottom:88px;right:24px;z-index:99999;display:flex;flex-direction:column-reverse;gap:8px;pointer-events:none;max-width:340px';
    document.body.appendChild(wrap);
  }
  function dismiss(el) {
    clearTimeout(el._toastTimer);
    el.style.opacity = '0'; el.style.transform = 'translateX(16px)';
    setTimeout(function() { el.remove(); }, 260);
  }
  // Dedupe: an identical message already showing just gets its timer refreshed instead of stacking again.
  var existing = wrap.querySelector('[data-toast-msg="' + CSS.escape(msg) + '"]');
  if (existing) {
    clearTimeout(existing._toastTimer);
    existing.classList.add('toast-repeat');
    existing._toastTimer = setTimeout(function() { dismiss(existing); }, dur);
    return;
  }
  var icn = {success:'✓',error:'✕',warning:'⚠',info:'ℹ'}[type] || 'ℹ';
  var clr = {
    success:'background:#f0fdf4;border-color:#22c55e;color:#166534',
    error:  'background:#fef2f2;border-color:#ef4444;color:#991b1b',
    warning:'background:#fffbeb;border-color:#f59e0b;color:#92400e',
    info:   'background:var(--accent-bg);border-color:var(--accent);color:var(--accent-txt)',
  }[type] || 'background:var(--bg);border-color:var(--border);color:var(--txt)';
  var el = document.createElement('div');
  el.dataset.toastMsg = msg;
  el.style.cssText = 'display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-radius:10px;border:1.5px solid;' + clr + ';font-size:13px;font-weight:500;box-shadow:0 4px 20px rgba(0,0,0,.12);pointer-events:auto;opacity:0;transform:translateX(16px);transition:opacity .22s,transform .22s;line-height:1.4';
  var closeBtn = document.createElement('span');
  closeBtn.textContent = '×';
  closeBtn.style.cssText = 'cursor:pointer;opacity:.5;font-size:18px;line-height:1;margin-left:4px;flex-shrink:0';
  closeBtn.onclick = function() { dismiss(el); };
  var icon = document.createElement('span');
  icon.textContent = icn;
  icon.style.cssText = 'font-size:15px;flex-shrink:0;margin-top:1px';
  var text = document.createElement('span');
  text.style.flex = '1';
  text.textContent = msg;
  el.appendChild(icon); el.appendChild(text); el.appendChild(closeBtn);
  wrap.appendChild(el);
  // Cap concurrent toasts so a burst of failures can't stack up and cover real UI.
  while (wrap.children.length > TOAST_MAX) dismiss(wrap.firstElementChild);
  requestAnimationFrame(function() { el.style.opacity = '1'; el.style.transform = 'translateX(0)'; });
  el._toastTimer = setTimeout(function() { dismiss(el); }, dur);
}

/* ── Custom confirm dialog ── */
function confirm2(msg, onOk, opts) {
  opts = opts || {};
  modal = {type:'__confirm__', msg:msg, title:opts.title||'Confirm',
           okLabel:opts.okLabel||'Confirm', danger:opts.danger!==false,
           icon:opts.icon||'⚠', onOk:onOk};
  render();
}

/* ── Global Search ── */
function doGlobalSearch(v) {
  globalSearch = v;
  var box = document.getElementById('gs-results');
  if (!box) return;
  if (!v.trim()) { box.style.display = 'none'; return; }
  var q = v.toLowerCase();
  var emps = USERS.filter(function(u) {
    return ((u.name||'')+(u.eid||'')+(u.pos||'')+(u.dept||'')+(u.email||'')).toLowerCase().indexOf(q) >= 0;
  }).slice(0, 6);
  var MODS = [
    {l:'Dashboard',v:'dashboard',ic:'🏠'},{l:'Employees',v:'employees',ic:'👥'},
    {l:'Onboarding',v:'onboarding',ic:'📋'},{l:'Attendance',v:'attendance',ic:'🕐'},
    {l:'Leave',v:'leave',ic:'🏖'},{l:'Payroll',v:'payroll',ic:'💰'},
    {l:'Gov\'t Remittances',v:'government',ic:'🏛'},{l:'My Payslips',v:'myslips',ic:'🧾'},
    {l:'Loans',v:'loans',ic:'🏦'},{l:'Recruitment',v:'recruitment',ic:'🎯'},
    {l:'Performance',v:'performance',ic:'⭐'},{l:'Analytics',v:'analytics',ic:'📈'},
    {l:'Reports',v:'reports',ic:'📊'},{l:'HR Assistant',v:'assistant',ic:'🤖'},
    {l:'Web Bundy',v:'webbundy',ic:'📍'},{l:'Org Structure',v:'orgsetup',ic:'🌳'},
    {l:'Access & Permissions',v:'accesssetup',ic:'🔐'},{l:'Company Settings',v:'company',ic:'⚙'},
  ].filter(function(m) { return m.l.toLowerCase().indexOf(q) >= 0 && canAccess(m.v); }).slice(0, 4);
  box.innerHTML = '';
  if (!emps.length && !MODS.length) {
    box.innerHTML = '<div style="padding:14px;font-size:13px;color:var(--txt3);text-align:center">No results for <strong>' + esc(v) + '</strong></div>';
  } else {
    if (emps.length) {
      var h = '<div style="padding:6px 12px 3px;font-size:10px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px">Employees</div>';
      emps.forEach(function(e) {
        h += '<div data-eid="'+e.id+'" style="display:flex;align-items:center;gap:10px;padding:7px 12px;cursor:pointer;border-radius:6px" onmouseover="this.style.background=\'var(--bg)\'" onmouseout="this.style.background=\'\'"><div class="avatar sm">'+ini(e.name)+'</div><div><div style="font-size:13px;font-weight:500">'+esc(e.name)+'</div><div style="font-size:11px;color:var(--txt3)">'+esc(e.eid||'')+' · '+esc(e.pos||e.dept||'')+'</div></div></div>';
      });
      box.innerHTML += h;
    }
    if (MODS.length) {
      var h2 = '<div style="padding:6px 12px 3px;font-size:10px;font-weight:700;color:var(--txt3);text-transform:uppercase;letter-spacing:.5px">Modules</div>';
      MODS.forEach(function(m) {
        h2 += '<div data-view="'+m.v+'" style="display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;font-size:13px;border-radius:6px" onmouseover="this.style.background=\'var(--bg)\'" onmouseout="this.style.background=\'\'">'+m.ic+' '+esc(m.l)+'</div>';
      });
      box.innerHTML += h2;
    }
  }
  /* Wire click handlers */
  var wrap = document.getElementById('gs-wrap');
  box.querySelectorAll('[data-eid]').forEach(function(el) {
    el.onclick = function() { openEmp(parseInt(el.getAttribute('data-eid'))); if(wrap) wrap.style.display='none'; globalSearch=''; };
  });
  box.querySelectorAll('[data-view]').forEach(function(el) {
    el.onclick = function() { goView(el.getAttribute('data-view')); if(wrap) wrap.style.display='none'; globalSearch=''; };
  });
  box.style.display = 'block';
}

/* ── Quick Action FAB ── */
var fabOpen = false;
function renderFAB() {
  if (!user || (isPlatformAdmin && !activeClientId)) return '';
  var isA = isAdminUser(user) || isPlatformAdmin;
  var acts = [];
  if (isA || canAccess('emp_add'))       acts.push({l:'Add Employee',  ic:'👤', v:'employees', t:1});
  if (isA || canAccess('payroll'))       acts.push({l:'Process Payroll',ic:'💰', v:'payroll'});
  if (isA || canAccess('leave_approve')) acts.push({l:'Approve Leave', ic:'📋', v:'leave'});
  if (isA || canAccess('reports'))       acts.push({l:'Reports',       ic:'📊', v:'reports'});
  if (isA || canAccess('assistant'))     acts.push({l:'HR Assistant',  ic:'🤖', v:'assistant'});
  if (!acts.length) return '';
  var html = '<div id="fab-root" style="position:fixed;bottom:24px;right:24px;z-index:9900;display:flex;flex-direction:column;align-items:flex-end;gap:8px">';
  if (fabOpen) {
    html += '<div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">';
    acts.forEach(function(a) {
      html += '<button data-fab-v="'+a.v+'"'+(a.t?' data-fab-t="'+a.t+'"':'')+' style="display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--surface2);border:1.5px solid var(--border);font-size:13px;font-weight:500;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.1);white-space:nowrap;color:var(--txt);transition:all .15s" onmouseover="this.style.background=\'var(--accent-bg)\';this.style.borderColor=\'var(--accent)\';this.style.color=\'var(--accent-txt)\'" onmouseout="this.style.background=\'var(--surface2)\';this.style.borderColor=\'var(--border)\';this.style.color=\'var(--txt)\'"><span>'+a.ic+'</span>'+a.l+'</button>';
    });
    html += '</div>';
  }
  html += '<button id="fab-main" style="width:50px;height:50px;border-radius:50%;background:var(--accent);border:none;color:#fff;font-size:26px;cursor:pointer;box-shadow:0 4px 18px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;transition:all .2s" onmouseover="this.style.transform=\'scale(1.08)\'" onmouseout="this.style.transform=\'scale(1)\'" title="Quick Actions (Ctrl+Q)">'+(fabOpen?'×':'+')+'</button>';
  html += '</div>';
  return html;
}

/* ── Wire FAB clicks after render ── */
function wireFAB() {
  var root = document.getElementById('fab-root');
  if (!root) return;
  var main = document.getElementById('fab-main');
  if (main) main.onclick = function() { fabOpen = !fabOpen; render(); };
  root.querySelectorAll('[data-fab-v]').forEach(function(btn) {
    btn.onclick = function() {
      var v = btn.getAttribute('data-fab-v');
      var t = btn.getAttribute('data-fab-t');
      if (t) tab = parseInt(t);
      goView(v);
      fabOpen = false;
    };
  });
}

/* ── Keyboard shortcuts ── */
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    if (fabOpen) { fabOpen = false; render(); return; }
    if (modal) { closeM(); return; }
    var gs = document.getElementById('gs-wrap');
    if (gs && gs.style.display !== 'none') { gs.style.display = 'none'; globalSearch = ''; return; }
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    var gs = document.getElementById('gs-wrap');
    if (gs) {
      gs.style.display = 'flex';
      var inp = document.getElementById('gs-input');
      if (inp) { inp.focus(); inp.select(); }
    }
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'q') {
    e.preventDefault(); fabOpen = !fabOpen; render();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'n' && view === 'employees' && (user && (isAdminUser(user) || isPlatformAdmin))) {
    e.preventDefault(); tab = 1; render();
  }
});

/* ── Override alert() with toast ── */
var _origAlert = window.alert.bind(window);
window.alert = function(msg) {
  if (typeof msg !== 'string' || msg.length > 400) { _origAlert(msg); return; }
  var type = /^(✅|✓|saved|success|updated|added|deleted|created|imported)/i.test(msg) ? 'success' :
             /^(⚠|cannot|invalid|please|required|min\.|at least)/i.test(msg) ? 'warning' :
             /^(error|failed|❌)/i.test(msg) ? 'error' : 'info';
  toast(msg.replace(/^[✅✓⚠❌]\s*/, ''), type);
};

render();

/* ── Post-render wiring ── */
var _origRender = render;
render = function() {
  _origRender();
  wireFAB();
};
