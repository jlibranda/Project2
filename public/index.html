  USERS.push(newAdmin);
  queueSync('Employees');
  alert(`✅ ${newAdmin.name} added as ${d.role==='employee'?'a staff':'an outsourced service'} administrator.\nLogin: ${newAdmin.email} / ${newAdmin.pass}`);
  closeM();
}

function pgZKSetup(){
  const serverUrl=window.apiHost||location.origin;
  const defaultAddress=serverUrl.replace(/^https?:\/\//,'');
  const defaultPort=serverUrl.startsWith('https')?'443':'80';
  const defaultHttps=serverUrl.startsWith('https');
  const ov=ZK.connectionOverride||{};
  const hasOverride=!!ov.address;
  const effAddress=hasOverride?ov.address:defaultAddress;
  const effPort=hasOverride?(ov.port||defaultPort):defaultPort;
  const effHttps=hasOverride?!!ov.https:defaultHttps;
  const tabs=['Connection','User Mapping','Pull & Import','Real-time','Device Tools'];
  const online=ZK.devices.filter(d=>d.lastSeen&&(Date.now()-new Date(d.lastSeen).getTime())<5*60*1000);
  let body='';

  /* ── Tab 0: Connection ── */
  if(tab===0){body=`
    <div class="card" style="margin-bottom:1rem">
      <div class="card-title" style="margin-bottom:.875rem">Configure on the device</div>
      <p style="font-size:13px;color:var(--txt2);margin-bottom:.75rem">This device supports ADMS — it pushes attendance to us, so no local bridge software is needed.</p>
      ${hasOverride?`<div style="font-size:12px;color:var(--green);margin-bottom:8px">✓ Showing your saved working settings (not the auto-detected default).</div>`
        :`<div style="font-size:12px;color:var(--txt3);margin-bottom:8px">Showing the auto-detected default. If your device only accepts a numeric IP, find your actual working address/port (see note below) and save it here.</div>`}
      <div style="display:grid;grid-template-columns:auto 1fr;gap:8px 14px;font-size:13px;margin-bottom:10px;align-items:center;max-width:420px">
        <div style="color:var(--txt3)">Address / IP</div><input id="zk-conn-address" class="finput mono" style="font-size:12px" value="${esc(effAddress)}"/>
        <div style="color:var(--txt3)">Port</div><input id="zk-conn-port" class="finput mono" style="font-size:12px" value="${esc(effPort)}"/>
        <div style="color:var(--txt3)">HTTPS</div><select id="zk-conn-https" class="finput" style="font-size:12px">
          <option value="0" ${!effHttps?'selected':''}>No</option>
          <option value="1" ${effHttps?'selected':''}>Yes</option>
        </select>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">
        <button class="btn btn-sm btn-primary" onclick="zkSaveConnectionOverride()">💾 Save as working settings</button>
        ${hasOverride?`<button class="btn btn-sm" onclick="zkResetConnectionOverride()">↺ Reset to auto-detected default</button>`:''}
        <button class="btn btn-sm" onclick="zkRefreshStatus()" ${ZK.loading?'disabled':''}>${ZK.loading?'Checking…':'↻ Refresh status'}</button>
      </div>
      <p style="font-size:12px;color:var(--txt3);margin-bottom:10px">The values above are the same regardless of which menu your device uses — enter them into whichever variant appears on your device:</p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:4px">
        <div style="border:1px solid var(--border);border-radius:8px;padding:10px 12px">
          <div style="font-size:12px;font-weight:700;margin-bottom:6px">Standard (domain-capable devices)</div>
          <ol style="font-size:12px;color:var(--txt2);margin:0;padding-left:16px;line-height:1.7">
            <li><strong>Menu → Comm → Cloud Server Setting</strong></li>
            <li>Server Address = Address/IP above</li>
            <li>Server Port = Port above</li>
            <li>Enable Domain Name = HTTPS above</li>
            <li>Enable ADMS / Cloud Server = Yes</li>
          </ol>
        </div>
        <div style="border:1px solid var(--border);border-radius:8px;padding:10px 12px">
          <div style="font-size:12px;font-weight:700;margin-bottom:6px">Proxy Server (numeric-IP-only devices, e.g. ZLM60_TFT)</div>
          <ol style="font-size:12px;color:var(--txt2);margin:0;padding-left:16px;line-height:1.7">
            <li><strong>Menu → Comm → Cloud Server Setting</strong></li>
            <li>Enable Proxy Server = Yes</li>
            <li><strong>Proxy Server IP</strong> = Address/IP above — this field only accepts a plain number like <span class="mono">66.33.22.221</span>, never a hostname/domain (see below if you only have a hostname)</li>
            <li>Proxy Server Port = Port above (the number after the colon in a hostname:port address, e.g. the <span class="mono">42235</span> in <span class="mono">sakura.proxy.rlwy.net:42235</span>)</li>
            <li>HTTPS = HTTPS above (usually "No" for a raw TCP proxy)</li>
          </ol>
          <div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);font-size:12px;color:var(--txt2)">
            <strong>Turning a proxy hostname into a numeric IP:</strong> on any computer, open Command Prompt (Windows) or Terminal (Mac), then run <span class="mono">ping yourproxyhostname</span> (the hostname only, without the port). The number in brackets in the reply — e.g. <span class="mono">Pinging sakura.proxy.rlwy.net [66.33.22.221]</span> — is what goes into Proxy Server IP.
          </div>
        </div>
      </div>
      <p style="font-size:12px;color:var(--txt3);margin-top:10px">Note: if your hosting provider only gives you a hostname (like Railway's "TCP Proxy" under Networking settings), resolve it to a numeric IP as shown above, then save that IP and port here so this screen shows the right thing next time.</p>
    </div>
    <div class="card" style="margin-bottom:1rem">
      <div class="card-title" style="margin-bottom:.5rem">Shift matching window</div>
      <p style="font-size:13px;color:var(--txt2);margin-bottom:.75rem">For employees with an assigned shift, a punch is matched to that shift's day if it falls within this window before/after the shift's start and end times (this also correctly handles overnight shifts that cross midnight). Punches outside this window are still recorded, but flagged as pending so the employee and their approver can confirm them. Employees without an assigned shift aren't affected — their punches use the device's raw date as before.</p>
      <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:10px">
        <label style="font-size:13px;color:var(--txt2)">Before shift start<br/><input id="zk-buffer-before" type="number" min="0" step="15" class="finput mono" style="font-size:12px;width:100px;margin-top:4px" value="${ZK.punchBuffer.beforeMinutes}"/> minutes</label>
        <label style="font-size:13px;color:var(--txt2)">After shift end<br/><input id="zk-buffer-after" type="number" min="0" step="15" class="finput mono" style="font-size:12px;width:100px;margin-top:4px" value="${ZK.punchBuffer.afterMinutes}"/> minutes</label>
      </div>
      <button class="btn btn-sm btn-primary" onclick="zkSavePunchBuffer()">💾 Save shift matching window</button>
    </div>
    <div class="card">
      <div class="card-title" style="margin-bottom:.875rem">Devices</div>
      ${ZK.devices.length?`<table><thead><tr><th>Serial</th><th>Last check-in</th><th>Pending punches</th><th>Status</th></tr></thead>
      <tbody>${ZK.devices.map(d=>{
        const isOnline=online.includes(d);
        return`<tr>
          <td class="mono" style="font-size:12px">${esc(d.serial)}</td>
          <td style="font-size:12px">${d.lastSeen?new Date(d.lastSeen).toLocaleString():'—'}</td>
          <td style="text-align:center">${d.pendingCount}</td>
          <td><span class="badge ${isOnline?'b-approved':'b-absent'}">${isOnline?'● Online':'○ Not seen recently'}</span></td>
        </tr>`;}).join('')}</tbody></table>`
      :`<div class="empty-state"><div class="ei">📡</div>No device has checked in yet. Once configured on the device, it should appear here within a minute or two.</div>`}
    </div>
  `;}

  /* ── Tab 1: User Mapping ── */
  else if(tab===1){
    const mappableUsers=zkMappableUsers();
    const empUseCount={};
    Object.values(ZK.userMapping).forEach(empId=>{if(empId)empUseCount[empId]=(empUseCount[empId]||0)+1;});
    const mappedEmpIds=new Set(Object.values(ZK.userMapping).filter(Boolean));
    const unmappedEmployees=USERS.filter(u=>u.role==='employee'&&u.active!==false&&!mappedEmpIds.has(u.id));
    body=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.875rem">
      <div style="font-size:13px;color:var(--txt2)">Map each ZKTeco user ID to an employee. This is a one-time setup.</div>
      <div style="display:flex;gap:6px">
        <button class="btn btn-sm" onclick="zkRefreshStatus()" ${ZK.loading?'disabled':''}>↻ Refresh device users</button>
        <button class="btn btn-sm btn-primary" onclick="zkSaveMapping()">Save mapping</button>
      </div>
    </div>
    ${mappableUsers.length?`<table><thead><tr><th>Device User ID</th><th>Device Name</th><th>Card No.</th><th>Map to Employee</th><th>Current Match</th></tr></thead>
    <tbody>${mappableUsers.map(du=>{
      const mapped=ZK.userMapping[du.userId]?USERS.find(u=>u.id===ZK.userMapping[du.userId]):null;
      const isDuplicate=mapped&&empUseCount[mapped.id]>1;
      return`<tr>
        <td class="mono" style="font-size:12px">${du.userId}</td>
        <td>${du.name||(du.fromPunchesOnly?'<span style="color:var(--txt3);font-style:italic">seen in punches only</span>':'—')}</td>
        <td class="mono" style="font-size:11px">${du.cardNo||'—'}</td>
        <td><select id="zkmap-${du.userId}" class="finput" style="font-size:12px">
          <option value="">— Unmapped —</option>
          ${USERS.filter(u=>u.role==='employee').map(e=>`<option value="${e.id}" ${ZK.userMapping[du.userId]===e.id?'selected':''}>${e.name} (${e.eid})</option>`).join('')}
        </select></td>
        <td>${mapped?`<span class="badge b-approved">${mapped.name}</span>`:`<span class="badge b-absent">Unmapped</span>`}${isDuplicate?` <span class="badge b-late" title="This employee is also mapped to another device user ID — their punches from all mapped IDs will be merged into one attendance record.">⚠ Already mapped elsewhere</span>`:''}</td>
      </tr>`;}).join('')}</tbody></table>`
    :`<div class="empty-state"><div class="ei">👆</div>No device users seen yet. Users appear here automatically as they're enrolled on the device or as punches come in, or click "Refresh device users".</div>`}
    <div class="card" style="margin-top:1rem">
      <div class="card-title" style="margin-bottom:.5rem">Employees without a mapped biometric (${unmappedEmployees.length})</div>
      ${unmappedEmployees.length?`<div style="display:flex;flex-wrap:wrap;gap:6px">${unmappedEmployees.map(e=>`<span class="badge b-absent">${e.name} (${e.eid})</span>`).join('')}</div>`
        :`<div style="font-size:13px;color:var(--txt2)">Every active employee has a mapped biometric ID. 🎉</div>`}
    </div>
  `;}

  /* ── Tab 2: Pull & Import ── */
  else if(tab===2){
    const unmappedCount=ZK.importPreview.filter(r=>!r.mapped).length;
    const dupCount=ZK.importPreview.filter(r=>r.duplicate).length;
    const readyCount=ZK.importPreview.filter(r=>r.mapped&&!r.duplicate).length;
    body=`
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:1rem;flex-wrap:wrap">
      <button class="btn btn-primary" onclick="zkPullAttendance()" ${ZK.loading?'disabled':''}>⬇ Fetch pending punches</button>
      ${ZK.lastSync?`<span style="font-size:12px;color:var(--txt3)">Last fetched: ${new Date(ZK.lastSync).toLocaleString()}</span>`:''}
    </div>
    ${ZK.pulledRecords.length?`
    <div style="display:flex;gap:10px;margin-bottom:.875rem;flex-wrap:wrap">
      <div class="metric" style="flex:1;min-width:120px"><div class="metric-label">Pulled</div><div class="metric-val">${ZK.pulledRecords.length}</div></div>
      <div class="metric" style="flex:1;min-width:120px"><div class="metric-label">Ready</div><div class="metric-val green">${readyCount}</div></div>
      <div class="metric" style="flex:1;min-width:120px"><div class="metric-label">Unmapped</div><div class="metric-val amber">${unmappedCount}</div></div>
      <div class="metric" style="flex:1;min-width:120px"><div class="metric-label">Duplicates</div><div class="metric-val" style="color:var(--txt3)">${dupCount}</div></div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:.875rem">
      <button class="btn btn-primary" onclick="zkImport()" ${!readyCount?'disabled':''}>✓ Import ${readyCount} records</button>
      <button class="btn" onclick="ZK.pulledRecords=[];ZK.importPreview=[];render()">Clear</button>
      ${unmappedCount?`<span style="font-size:12px;color:var(--amber);align-self:center">⚠ ${unmappedCount} unmapped — go to User Mapping tab</span>`:''}
    </div>
    <div style="overflow-x:auto"><table style="min-width:640px"><thead><tr><th>Device User ID</th><th>Employee</th><th>Date</th><th>Time In</th><th>Time Out</th><th>Punches</th><th>Source</th><th>Status</th></tr></thead>
    <tbody>${(() => {
      // Group by userId+date
      const grp={};
      ZK.importPreview.forEach(r=>{
        const k=r.userId+'_'+r.date;
        if(!grp[k])grp[k]={...r,entries:[]};
        if(r.time)grp[k].entries.push({time:r.time,kind:zkPunchKind(r.statusCode)});
      });
      return Object.values(grp).map(g=>{
        const{tin,tout}=zkPickInOut(g.entries);
        const tagged=g.entries.some(e=>e.kind);
        const statusBadge=g.duplicate?'<span class="badge b-absent">duplicate</span>':!g.mapped?'<span class="badge b-pending">unmapped</span>':'<span class="badge b-approved">ready</span>';
        return`<tr>
          <td class="mono" style="font-size:12px">${g.userId}</td>
          <td>${g.mapped?`<div class="emp-cell"><div class="avatar sm">${ini(g.empName)}</div>${g.empName}</div>`:`<span style="color:var(--red);font-size:12px">Unmapped</span>`}</td>
          <td>${g.date||'—'}</td>
          <td class="mono" style="font-size:12px">${tin||'—'}</td>
          <td class="mono" style="font-size:12px">${tout||'—'}</td>
          <td style="text-align:center">${g.entries.length}</td>
          <td style="font-size:11px;color:var(--txt3)" title="${tagged?'Using the device\'s own in/out toggle':'No in/out tag from the device — using earliest/latest punch instead'}">${tagged?'Device tag':'Earliest/latest'}</td>
          <td>${statusBadge}</td>
        </tr>`;
      }).join('');
    })()}</tbody></table></div>`
    :`<div class="empty-state"><div class="ei">📥</div>Click "Fetch pending punches" to see attendance the device has pushed since your last import.</div>`}
  `;}

  /* ── Tab 3: Real-time ── */
  else if(tab===3){body=`
    <div class="card" style="margin-bottom:1rem">
      <div class="card-title" style="margin-bottom:.875rem">Live Punch Monitor</div>
      <p style="font-size:13px;color:var(--txt2);margin-bottom:1rem">ADMS devices push punches to the server as they happen — there's nothing to "enable" on the device side. Turn this on to auto-refresh the pending list here every 20 seconds while you're on this page; you still choose when to import (Pull &amp; Import tab).</p>
      <div style="display:flex;align-items:center;gap:14px">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-size:14px">
          <input type="checkbox" style="width:auto;accent-color:var(--accent)" ${ZK.realtimeEnabled?'checked':''} onchange="ZK.realtimeEnabled=this.checked;if(ZK.realtimeEnabled)startRealtime();else stopRealtime();render()"/>
          <span style="font-weight:500">${ZK.realtimeEnabled?'Auto-refresh ON':'Auto-refresh OFF'}</span>
        </label>
        <span class="badge ${ZK.realtimeEnabled?'b-approved':'b-absent'}">${ZK.realtimeEnabled?'Active':'Inactive'}</span>
      </div>
      ${ZK.lastSync?`<div style="font-size:12px;color:var(--txt3);margin-top:8px">Last refresh: ${new Date(ZK.lastSync).toLocaleString()}</div>`:''}
    </div>
  `;}

  /* ── Tab 4: Device Tools ── */
  else if(tab===4){
    const statusBadge=s=>({pending:'b-pending',sent:'b-processing',done:'b-approved',failed:'b-absent'}[s]||'b-pending');
    body=`
    <div class="card" style="margin-bottom:1rem">
      <div class="card-title" style="margin-bottom:.5rem">About remote commands</div>
      <p style="font-size:13px;color:var(--txt2)">Commands are queued here and run the next time the device checks in with the server (usually within a minute). Clock sync isn't included — there's no single ADMS command that reliably works across all ZKTeco firmware, so please set the date/time directly on the device's own menu instead.</p>
    </div>
    ${ZK.devices.length?ZK.devices.map(d=>`
      <div class="card" style="margin-bottom:1rem">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.75rem;flex-wrap:wrap;gap:8px">
          <div class="card-title mono" style="margin-bottom:0">${esc(d.serial)}</div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <button class="btn btn-sm" onclick="zkSendCommand('${esc(d.serial)}','reboot')">🔄 Restart device</button>
            <button class="btn btn-sm" onclick="zkSendCommand('${esc(d.serial)}','resync')">📡 Resync attendance log</button>
            <button class="btn btn-sm" style="color:var(--red)" onclick="zkSendCommand('${esc(d.serial)}','clearlog','⚠ This permanently deletes the attendance log stored on the device itself. Any punches the server hasn\\'t received yet will be lost. Continue?')">🗑️ Clear attendance log</button>
          </div>
        </div>
        ${(d.commands||[]).length?`<table><thead><tr><th>Command</th><th>Status</th><th>Queued</th><th>Completed</th><th>Result</th></tr></thead>
        <tbody>${d.commands.map(c=>`<tr>
          <td>${esc(c.label||c.command)}</td>
          <td><span class="badge ${statusBadge(c.status)}">${esc(c.status)}</span></td>
          <td style="font-size:12px">${c.queuedAt?new Date(c.queuedAt).toLocaleString():'—'}</td>
          <td style="font-size:12px">${c.completedAt?new Date(c.completedAt).toLocaleString():'—'}</td>
          <td style="font-size:12px">${c.returnCode!=null?(c.returnCode==='0'?'Success':'Return code '+esc(c.returnCode)):'—'}</td>
        </tr>`).join('')}</tbody></table>`
        :`<div style="font-size:13px;color:var(--txt2)">No commands sent yet.</div>`}
      </div>
    `).join(''):`<div class="empty-state"><div class="ei">📡</div>No device has checked in yet. Once it appears under Connection, you can send it commands here.</div>`}
  `;}

  return`<div class="page-header"><div><div class="page-title">ZKTeco Biometric Device</div>
  <div style="display:flex;align-items:center;gap:8px;margin-top:3px">
    <div style="width:8px;height:8px;border-radius:50%;background:${online.length?'var(--green)':'var(--txt3)'}"></div>
    <span style="font-size:12px;color:${online.length?'var(--green)':'var(--txt3)'}">${online.length?online.length+' device(s) online':ZK.devices.length?'No device seen recently':'No device connected yet'}</span>
  </div></div></div>
  <div class="tabs">${tabs.map((t,i)=>`<div class="tab${tab===i?' active':''}" onclick="goTab(${i})">${t}</div>`).join('')}</div>
  <div>${body}</div>`;
}

let realtimeTimer=null;
function startRealtime(){
  if(realtimeTimer)clearInterval(realtimeTimer);
  realtimeTimer=setInterval(async()=>{
    if(!ZK.realtimeEnabled)return;
    await zkPullAttendance();
  },20000);
}
function stopRealtime(){if(realtimeTimer){clearInterval(realtimeTimer);realtimeTimer=null;}}

function pgApprovalSetup(){
  const activeEmps=USERS.filter(u=>u.active!==false&&u.role!=='admin');
  const maxG=APPROVAL_CONFIG.maxLayers||4;

  /* Compact chain badge row */
  const chainBadges=(chain)=>{
    if(!chain.length)return`<span style="font-size:11px;color:var(--txt3);font-style:italic">No chain</span>`;
    return chain.map(l=>`<span style="display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 7px;border-radius:5px;
      background:${l.mode==='custom'?'var(--amber-bg)':'var(--bg)'};
      border:1px solid ${l.mode==='custom'?'var(--amber)':'var(--border)'};
      color:${l.mode==='custom'?'var(--amber-txt)':'var(--txt)'}">
      <span style="font-size:9px;font-weight:700;color:var(--txt3)">L${l.layer}</span>
      ${esc(l.approver.name)}
      ${l.mode==='custom'?`<span style="font-size:9px;background:var(--amber);color:#fff;padding:0 4px;border-radius:3px">custom</span>`:''}
    </span>`).join('<span style="color:var(--txt3);margin:0 2px">→</span>');
  };

  /* Stats */
  const configured=Object.keys(APPROVAL_CONFIG.perEmployee||{}).filter(eid=>activeEmps.find(e=>e.eid===eid)).length;
  const noHead=activeEmps.filter(e=>!e.immediateHeadEid).length;

  return`<div class="page-header">
    <div><div class="page-title">Approval Layers</div>
    <div class="page-sub">Set how many layers of approval each employee requires and optionally assign custom approvers per layer</div></div>
  </div>

  <!-- Summary bar -->
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem;margin-bottom:1rem">
    <div class="card" style="padding:12px 16px">
      <div style="font-size:11px;color:var(--txt3);margin-bottom:3px">Active Employees</div>
      <div style="font-size:22px;font-weight:700">${activeEmps.length}</div>
    </div>
    <div class="card" style="padding:12px 16px">
      <div style="font-size:11px;color:var(--txt3);margin-bottom:3px">Custom Configured</div>
      <div style="font-size:22px;font-weight:700;color:var(--accent-txt)">${configured}</div>
    </div>
    <div class="card" style="padding:12px 16px;border-color:${noHead?'var(--amber)':'var(--border)'}">
      <div style="font-size:11px;color:var(--txt3);margin-bottom:3px">Missing Immediate Head</div>
      <div style="font-size:22px;font-weight:700;color:${noHead?'var(--amber)':'var(--green)'}">${noHead}</div>
    </div>
  </div>

  <!-- Global cap -->
  <div class="card" style="margin-bottom:1rem;padding:12px 16px;display:flex;align-items:center;gap:1rem;flex-wrap:wrap">
    <div style="flex:1;min-width:200px">
      <div style="font-weight:600;font-size:13px">Global Maximum Layers</div>
      <div style="font-size:12px;color:var(--txt3);margin-top:2px">No employee's chain can exceed this, regardless of individual settings</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px">
      <select class="finput" style="font-size:13px;width:80px"
        onchange="APPROVAL_CONFIG.maxLayers=parseInt(this.value);queueSync('Approval_Config');render()">
        ${[1,2,3,4,5,6].map(n=>`<option value="${n}" ${maxG===n?'selected':''}>${n}</option>`).join('')}
      </select>
      <span style="font-size:12px;color:var(--txt3)">layers max</span>
    </div>
    <div style="font-size:12px;color:var(--accent-txt);padding:6px 10px;background:var(--accent-bg);border-radius:6px">
      Default for unconfigured employees: <strong>${APPROVAL_CONFIG.defaultLayers||1} layer</strong>
      <select style="margin-left:8px;font-size:12px;border:1px solid var(--border);border-radius:4px;padding:2px 6px;background:var(--bg)"
        onchange="APPROVAL_CONFIG.defaultLayers=parseInt(this.value);queueSync('Approval_Config');render()">

function pgOrgSetup(){
  function subHtml(bu,d,t){return t.subteams.map((s,si)=>`<span style="display:inline-flex;align-items:center;gap:4px;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:5px;padding:2px 7px;font-size:11px;margin:2px">${s}<button onclick="editSubteam(${bu.id},${d.id},${t.id},${si})" style="background:none;border:none;cursor:pointer;color:#94a3b8;font-size:11px;padding:0 1px">✎</button><button onclick="delSubteam(${bu.id},${d.id},${t.id},${si})" style="background:none;border:none;cursor:pointer;color:#f87171;font-size:11px;padding:0 1px">✕</button></span>`).join('');}
  function teamHtml(bu,d){return d.teams.map(t=>`<div style="margin-left:2rem;padding:8px 10px;border-left:3px solid var(--border);margin-bottom:5px;border-radius:0 6px 6px 0">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
      <div style="font-size:13px;font-weight:500">${t.name} <span style="font-size:10px;font-weight:400;color:#6b7280;background:#f3f4f6;padding:1px 6px;border-radius:4px">Team · ${t.subteams.length} subteams</span></div>
      <div style="display:flex;gap:4px">
        <button class="btn btn-sm" style="font-size:10px;padding:3px 8px" onclick="editTeam(${bu.id},${d.id},${t.id})">✎</button>
        <button class="btn btn-sm" style="font-size:10px;padding:3px 8px" onclick="addSubteam(${bu.id},${d.id},${t.id})">+ Sub</button>
        <button class="btn btn-sm btn-danger" style="font-size:10px;padding:3px 8px" onclick="delTeam(${bu.id},${d.id},${t.id})">✕</button>
      </div>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:2px">${subHtml(bu,d,t)||'<span style="font-size:11px;color:var(--txt3)">No subteams</span>'}</div>
  </div>`).join('');}
  function deptHtml(bu){return bu.depts.map(d=>`<div style="margin:6px 0 6px 1rem;border:1px solid var(--border);border-radius:8px;padding:10px 12px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px">
      <div style="font-weight:600">${d.name} <span style="font-size:10px;font-weight:400;background:#e0e7ff;color:#3730a3;padding:1px 7px;border-radius:4px">Dept</span> <span style="font-size:11px;color:var(--txt3)">${d.teams.length} team${d.teams.length!==1?'s':''}</span></div>
      <div style="display:flex;gap:4px">
        <button class="btn btn-sm" style="font-size:10px;padding:3px 8px" onclick="editDept(${bu.id},${d.id})">✎ Rename</button>
        <button class="btn btn-sm" style="font-size:10px;padding:3px 8px" onclick="addTeam(${bu.id},${d.id})">+ Team</button>
        <button class="btn btn-sm btn-danger" style="font-size:10px;padding:3px 8px" onclick="delDept(${bu.id},${d.id})">✕ Delete</button>
      </div>
    </div>
    ${teamHtml(bu,d)||'<div style="font-size:12px;color:var(--txt3);margin-left:.5rem">No teams yet.</div>'}
  </div>`).join('');}
  return`<div class="page-header"><div><div class="page-title">Org Structure Setup</div><div class="page-sub">Business Units → Departments → Teams → Subteams</div></div>
  <button class="btn btn-primary" onclick="addBU()">+ Business Unit</button></div>
  ${ORG.length?ORG.map(bu=>`<div class="card">
    <div class="card-hd">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="width:38px;height:38px;border-radius:9px;background:var(--accent-bg);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--accent)">${bu.code}</div>
        <div><div class="card-title">${bu.name}</div><div class="card-sub">${bu.depts.length} dept${bu.depts.length!==1?'s':''} · ${bu.depts.reduce((s,d)=>s+d.teams.length,0)} teams · ${bu.depts.reduce((s,d)=>s+d.teams.reduce((ss,t)=>ss+t.subteams.length,0),0)} subteams</div></div>
      </div>
      <div style="display:flex;gap:5px">
        <button class="btn btn-sm" onclick="editBU(${bu.id})">✎ Rename</button>
        <button class="btn btn-sm" onclick="addDept(${bu.id})">+ Dept</button>
        <button class="btn btn-sm btn-danger" onclick="delBU(${bu.id})">✕ Delete</button>
      </div>
    </div>
    ${deptHtml(bu)||'<div style="font-size:13px;color:var(--txt3);padding:.5rem 1rem">No departments yet.</div>'}

}
function addBU(){const n=prompt('Business Unit name:');if(!n?.trim())return;const c=prompt('Short code (e.g. TECH):');if(!c?.trim())return;ORG.push({id:nOrg++,name:n.trim(),code:c.trim().toUpperCase(),depts:[]});render();}
function editBU(bid){const bu=ORG.find(b=>b.id===bid);const n=prompt('Rename BU:',bu.name);if(!n?.trim())return;const c=prompt('Update code:',bu.code);bu.name=n.trim();if(c?.trim())bu.code=c.trim().toUpperCase();render();}
function delBU(bid){const bu=ORG.find(b=>b.id===bid);if(!confirm(`Delete BU "${bu.name}" and ALL its contents?`))return;ORG.splice(ORG.indexOf(bu),1);render();}
function addDept(bid){const bu=ORG.find(b=>b.id===bid);const n=prompt(`Department under "${bu.name}":`);if(!n?.trim())return;bu.depts.push({id:nOrgDept++,name:n.trim(),teams:[]});render();}
function editDept(bid,did){const bu=ORG.find(b=>b.id===bid);const d=bu.depts.find(x=>x.id===did);const n=prompt('Rename Dept:',d.name);if(!n?.trim())return;d.name=n.trim();render();}
function delDept(bid,did){const bu=ORG.find(b=>b.id===bid);const d=bu.depts.find(x=>x.id===did);if(!confirm(`Delete "${d.name}" and all its teams?`))return;bu.depts=bu.depts.filter(x=>x.id!==did);render();}
function addTeam(bid,did){const bu=ORG.find(b=>b.id===bid);const d=bu.depts.find(x=>x.id===did);const n=prompt(`Team under "${d.name}":`);if(!n?.trim())return;d.teams.push({id:nOrgTeam++,name:n.trim(),subteams:[]});render();}
function editTeam(bid,did,tid){const bu=ORG.find(b=>b.id===bid);const d=bu.depts.find(x=>x.id===did);const t=d.teams.find(x=>x.id===tid);const n=prompt('Rename Team:',t.name);if(!n?.trim())return;t.name=n.trim();render();}
function delTeam(bid,did,tid){const bu=ORG.find(b=>b.id===bid);const d=bu.depts.find(x=>x.id===did);const t=d.teams.find(x=>x.id===tid);if(!confirm(`Delete team "${t.name}"?`))return;d.teams=d.teams.filter(x=>x.id!==tid);render();}
function addSubteam(bid,did,tid){const bu=ORG.find(b=>b.id===bid);const d=bu.depts.find(x=>x.id===did);const t=d.teams.find(x=>x.id===tid);const n=prompt(`Subteam under "${t.name}":`);if(!n?.trim())return;t.subteams.push(n.trim());render();}
function editSubteam(bid,did,tid,si){const bu=ORG.find(b=>b.id===bid);const d=bu.depts.find(x=>x.id===did);const t=d.teams.find(x=>x.id===tid);const n=prompt('Rename Subteam:',t.subteams[si]);if(!n?.trim())return;t.subteams[si]=n.trim();render();}
function delSubteam(bid,did,tid,si){const bu=ORG.find(b=>b.id===bid);const d=bu.depts.find(x=>x.id===did);const t=d.teams.find(x=>x.id===tid);if(!confirm(`Delete subteam "${t.subteams[si]}"?`))return;t.subteams.splice(si,1);render();}


function pgLookupSetup(){
  const sections=[
    {key:'bandLevels',label:'Band / Level',desc:'Job grades and levels (e.g. IC1, L2, M1). Used in 201 files and employee records.',hasCode:true,
     cols:['Code','Label']},
    {key:'costCenters',label:'Cost Centers',desc:'Financial cost allocation codes linked to departments or teams.',hasCode:true,
     cols:['Code','Label']},
    {key:'pods',label:'Pods',desc:'Cross-functional squad or pod names.',hasCode:false,
     cols:['Name']},
    {key:'disciplines',label:'Disciplines',desc:'Functional expertise areas (e.g. Engineering, Design, Finance).',hasCode:false,
     cols:['Name']},
    {key:'employmentTypes',label:'Employment Types',desc:'Contract classification of employees.',hasCode:true,
     cols:['Code','Label']},
    {key:'terminationTypes',label:'Termination Types',desc:'Reason for separation used in Offboarding tab.',hasCode:true,
     cols:['Code','Label']},
    {key:'attritionCodes',label:'Attrition Codes',desc:'Voluntary vs involuntary attrition classification for analytics.',hasCode:true,
     cols:['Code','Label']},
    {key:'payTypes',label:'Pay Types',desc:'Payment frequency used in Compensation tab.',hasCode:true,
     cols:['Code','Label']},
    {key:'currencies',label:'Currencies',desc:'Currency codes used in Compensation tab.',hasCode:true,
     cols:['Code','Label']},
    {key:'entityNames',label:'Entity Names',desc:'Legal entities used in Employment tab.',hasCode:true,
     cols:['Code','Label']},
  ];
  function rows(key,hasCode){
    return LOOKUPS[key].map((item,i)=>hasCode?`
    <tr>
      <td><input class="finput" style="font-size:12px" value="${esc(item.code)}" onchange="LOOKUPS['${key}'][${i}].code=this.value"/></td>
      <td><input class="finput" style="font-size:12px" value="${esc(item.label)}" onchange="LOOKUPS['${key}'][${i}].label=this.value"/></td>
      <td><button class="btn btn-sm btn-danger" style="padding:3px 8px" onclick="delLookup('${key}',${i})">✕</button></td>
    </tr>`:`
    <tr>
      <td><input class="finput" style="font-size:12px" value="${esc(item.name)}" onchange="LOOKUPS['${key}'][${i}].name=this.value"/></td>
      <td><button class="btn btn-sm btn-danger" style="padding:3px 8px" onclick="delLookup('${key}',${i})">✕</button></td>
    </tr>`).join('');
  }
  return`<div class="page-header"><div><div class="page-title">Lookup Tables</div><div class="page-sub">Manage dropdown values for Band Level, Cost Center, Pod, Discipline, and Employment Type</div></div></div>
  <div style="background:var(--accent-bg);border-radius:10px;padding:12px 16px;margin-bottom:1rem;font-size:13px;color:var(--accent-txt)">
    <strong>Tip:</strong> Changes here update dropdown options everywhere — the Add Employee form, 201 files, and search filters. Edit cells inline, then click <strong>Save All</strong>.
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem">
  ${sections.map(s=>`<div class="card">
    <div class="card-hd">
      <div><div class="card-title">${s.label}</div><div class="card-sub">${s.desc}</div></div>
      <button class="btn btn-sm btn-primary" onclick="addLookup('${s.key}',${s.hasCode})">+ Add</button>
    </div>
    <table><thead><tr>${s.cols.map(c=>`<th>${c}</th>`).join('')}<th></th></tr></thead>
    <tbody>${rows(s.key,s.hasCode)}</tbody></table>
  </div>`).join('')}
  </div>
  <div style="margin-top:4px;text-align:right">
    <button class="btn btn-success" onclick="alert('All lookup changes are saved automatically as you type!')">✓ Changes auto-saved</button>
  </div>`;
}
function addLookup(key,hasCode){
  const id=nLookup[key]++;
  if(hasCode){
    const code=prompt(`New ${key} code (e.g. L8):`);if(!code?.trim())return;
    const label=prompt(`Label for "${code}":`);if(!label?.trim())return;
    LOOKUPS[key].push({id,code:code.trim(),label:label.trim()});
  }else{
    const name=prompt(`New ${key} name:`);if(!name?.trim())return;
    LOOKUPS[key].push({id,name:name.trim()});
  }
  render();
}
function delLookup(key,idx){
  const item=LOOKUPS[key][idx];
  const label=item.name||item.label||item.code;
  if(!confirm(`Delete "${label}" from ${key}?`))return;
  LOOKUPS[key].splice(idx,1);render();
}

/* =========================================================
   WEB BUNDY + GEOTAGGING
   ========================================================= */
function haversine(lat1,lng1,lat2,lng2){
  const R=6371000,r=x=>x*Math.PI/180;
  const a=Math.sin(r(lat2-lat1)/2)**2+Math.cos(r(lat1))*Math.cos(r(lat2))*Math.sin(r(lng2-lng1)/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function checkZone(lat,lng){
  let best=null,bestDist=Infinity;
  for(const z of OFFICE_ZONES){
    const d=haversine(lat,lng,z.lat,z.lng);
    if(d<bestDist){bestDist=d;best=z;}
    if(d<=z.radius)return{zone:z,distance:Math.round(d),within:true};
  }
  return{zone:best,distance:Math.round(bestDist),within:false};
}
async function fetchGeo(){
  if(!navigator.geolocation){alert('Geolocation is not supported by your browser.');return;}
  geoSt={loading:true,lat:null,lng:null,accuracy:null,address:'',zoneResult:null};render();
  navigator.geolocation.getCurrentPosition(async pos=>{
    const{latitude:lat,longitude:lng,accuracy}=pos.coords;
    const zoneResult=checkZone(lat,lng);
    let address=`${lat.toFixed(6)}, ${lng.toFixed(6)}`;
    try{
      const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`,{headers:{'Accept-Language':'en'}});
      const d=await r.json();
      if(d.display_name)address=d.display_name.split(',').slice(0,4).join(',').trim();
    }catch(_){}
    geoSt={loading:false,lat,lng,accuracy:Math.round(accuracy),address,zoneResult};
    render();
  },err=>{
    geoSt={loading:false,lat:null,lng:null,accuracy:null,address:'',zoneResult:null};
    alert(`Location error: ${err.message}\n\nPlease allow location access in your browser and try again.`);
    render();
  },{enableHighAccuracy:true,timeout:20000,maximumAge:0});
}
function startBundyClock(){
  if(clockTmr)clearInterval(clockTmr);
  clockTmr=setInterval(()=>{
    const el=document.getElementById('bundy-clock');
    if(!el){clearInterval(clockTmr);clockTmr=null;return;}
    el.textContent=new Date().toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:true});
  },1000);
}
async function startBundyCam(){
  try{
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:320,height:240},audio:false});
    const vid=document.getElementById('selfie-vid');
    if(vid){vid.srcObject=camStream;vid.play();document.getElementById('cam-placeholder')?.remove();}
  }catch(e){console.log('Camera unavailable:',e.message);}

function stopBundyCam(){
  if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;}

function captureSelfie(){

async function doBundy(type){
  if(!geoSt.lat){alert('Please get your location first before clocking in.');return;}
  const now=new Date();
  const todayLogs=BUNDY_LOGS.filter(b=>b.eid===user.id&&b.date===today());
  const lastIn=[...todayLogs].reverse().find(b=>b.type==='in');
  const lastOut=[...todayLogs].reverse().find(b=>b.type==='out');
  const isClockedIn=lastIn&&(!lastOut||lastIn.datetime>lastOut.datetime);
  if(type==='in'&&isClockedIn){if(!confirm('You are already clocked in. Record another clock-in?'))return;}
  if(type==='out'&&!isClockedIn){if(!confirm('No active clock-in found. Record clock-out anyway?'))return;}
  const entry={id:nBundy++,eid:user.id,empName:user.name,type,date:today(),
    time:now.toTimeString().slice(0,5),datetime:now.toISOString(),
    lat:geoSt.lat,lng:geoSt.lng,accuracy:geoSt.accuracy,
    address:geoSt.address,zoneResult:geoSt.zoneResult,
    withinZone:geoSt.zoneResult?.within||false,selfie:selfieData};
  BUNDY_LOGS.push(entry);
  /* Sync to attendance */
  const existing=attendanceRecord(user.id,today());
  if(type==='in'&&!existing){
    const late=now.getHours()>8||(now.getHours()===8&&now.getMinutes()>=30);
    upsertAttendance(user.id,today(),{tin:entry.time,tout:'',status:late?'late':'present',ot:0,nd:0,notes:'Web Bundy',source:'web-bundy',approvalStatus:'approved',filedBy:user.name});
  }else if(type==='in'&&existing&&!existing.tin){upsertAttendance(user.id,today(),{tin:entry.time,source:'web-bundy',approvalStatus:'approved',filedBy:user.name});
  }else if(type==='out'&&existing&&!existing.tout){upsertAttendance(user.id,today(),{tout:entry.time,source:'web-bundy',approvalStatus:'approved',filedBy:user.name});}
  queueSync('Bundy_Logs','Attendance');selfieData=null;
  const zoneNote=entry.withinZone?'\n\u2705 Within office zone':'\n\u26A0 You are outside the office zone';
  alert((type==='in'?'Clocked IN at '+entry.time:'Clocked OUT at '+entry.time)+zoneNote);
  render();setTimeout(startBundyCam,200);
}

function addZone(){
  const name=prompt('Zone name (e.g. "Main Office", "Branch 2"):');if(!name?.trim())return;
  const latStr=prompt('Latitude\n(Right-click your office on Google Maps → copy coordinates):');
  const lat=parseFloat(latStr);if(isNaN(lat)){alert('Invalid latitude.');return;}
  const lngStr=prompt('Longitude:');
  const lng=parseFloat(lngStr);if(isNaN(lng)){alert('Invalid longitude.');return;}
  const rad=parseInt(prompt('Allowed radius in meters\n(100m = strict, 500m = lenient):','100'))||100;
  const addr=prompt('Address label (optional):');
  OFFICE_ZONES.push({id:nZone++,name:name.trim(),lat,lng,radius:rad,address:addr||''});
  queueSync('Office_Zones');render();
}
function editZone(id){
  const z=OFFICE_ZONES.find(x=>x.id===id);
  const name=prompt('Zone name:',z.name);if(name?.trim())z.name=name.trim();
  const lat=parseFloat(prompt('Latitude:',z.lat));if(!isNaN(lat))z.lat=lat;
  const lng=parseFloat(prompt('Longitude:',z.lng));if(!isNaN(lng))z.lng=lng;
  const rad=parseInt(prompt('Radius (meters):',z.radius));if(!isNaN(rad))z.radius=rad;

function delZone(id){
  if(!confirm('Delete this office zone?'))return;
  OFFICE_ZONES.splice(OFFICE_ZONES.findIndex(z=>z.id===id),1);queueSync('Office_Zones');render();
}

function gsLog(msg,type='info'){
  GS.log.unshift({msg,type,time:new Date().toLocaleTimeString('en-PH')});
  if(GS.log.length>30)GS.log.pop();
}

async function gsCall(params,body){
  if(!GS.url){throw new Error('No Google Sheets URL set. Enter it in Setup → Google Sheets → Connection tab.');}
  const qs=params?'?'+new URLSearchParams(params).toString():'';
  try{
    let r;
    if(body){
      /* POST — use text/plain to avoid CORS preflight OPTIONS request.
         Apps Script reads e.postData.contents regardless of Content-Type. */
      r=await fetch(GS.url+qs,{
        method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify(body),
        redirect:'follow',
      });
    }else{
      /* GET — works fine without any special headers */
      r=await fetch(GS.url+qs,{redirect:'follow'});
    }
    const text=await r.text();
    /* Apps Script sometimes wraps response in a callback or returns HTML on error */
    if(text.trim().startsWith('<')){
      throw new Error('Apps Script returned an HTML page. Check:\n1. The URL is the /exec link (not /dev)\n2. Deployment is set to "Anyone" access\n3. You clicked "Authorize" when prompted');
    }
    try{return JSON.parse(text);}
    catch(_){throw new Error('Non-JSON response: '+text.slice(0,120));}
  }catch(err){
    if(err.message.includes('Failed to fetch')||err.message.includes('NetworkError')){
      throw new Error('Cannot reach Google Apps Script.\n\nCommon causes:\n• The Apps Script URL is wrong or not deployed\n• Deploy access is not set to "Anyone"\n• You need to re-deploy after script changes');
    }
    throw err;
  }
}

async function gsPing(){
  GS.status='connecting';GS.statusMsg='';render();
  try{
    const d=await gsCall({action:'ping'});
    if(d.ok){GS.status='connected';GS.statusMsg='';gsLog('Connected to Google Sheets ✅','ok');}
    else throw new Error(d.error||'ping failed');
  }catch(e){GS.status='error';GS.statusMsg=e.message;gsLog('Connection failed: '+e.message,'error');}
  render();
}

function buildSyncPayload(){
  /* Collect all custom fields across all tabs */

  const customKeys=allCustom.map(f=>f.key);

  const emps=USERS.map(u=>[

    u.pos||'',u.bandLevel||'',u.nonMass||'',u.costCenter||'',
    u.type||'',u.hired||'',u.probEndDate||'',u.rate||0,
    u.salaryPA||0,u.salaryPM||0,u.basis13||'13-month',
    u.mobileAllowance||0,u.riceAllowance||0,u.stockOptions||'N',u.esopGranted||'N',
    u.esopEntity||'',u.loanEligibility||'Y',
    u.sss||'',u.ph||'',u.pi||'',u.tin||'',
    u.bank||'',u.bankAccount||'',u.bday||'',

    u.gender||'',u.maritalStatus||'',u.spouseName||'',u.religion||'',u.city||'',
    u.permanentAddress||'',u.temporaryAddress||'',u.contact||'',u.contact2||'',
    u.ec1Name||'',u.ec1Rel||'',u.ec1Contact||'',u.ec1Addr||'',
    u.ec2Name||'',u.ec2Rel||'',u.ec2Contact||'',u.ec2Addr||'',
    u.status||'active',u.active!==false?'TRUE':'FALSE',u.accessLevelId||5,u.entityName||'',
    new Date().toISOString(),
    /* custom field values — one column per custom field */
    ...customKeys.map(k=>u[k]!==undefined?u[k]:''),
  ]);
  const att=ATT.map(a=>{const emp=USERS.find(u=>u.id===a.eid);return[
    a.id,emp?.eid||a.eid,emp?.name||'',a.date,a.tin||'',a.tout||'',
    a.status||'',a.ot||0,a.nd||0,a.notes||'',a.notes?.includes('Bundy')?'Web Bundy':'Manual'
  ];});
  const leaves=LEAVES.map(l=>{const emp=USERS.find(u=>u.id===l.eid);return[
    l.id,emp?.eid||l.eid,emp?.name||'',l.type||'',l.s||'',l.e||'',l.days||1,
    l.reason||'',l.status||'',l.filed||'',l.reviewedBy||'',l.reviewedOn||''
  ];});
  const payRuns=PAYROLLS.map(r=>[
    r.id,r.from,r.to,r.on,r.items.length,
    r.items.reduce((s,i)=>s+i.gross,0).toFixed(2),
    r.items.reduce((s,i)=>s+i.total,0).toFixed(2),
    r.items.reduce((s,i)=>s+i.net,0).toFixed(2),
  ]);
  const payItems=PAYROLLS.flatMap(r=>r.items.map(i=>[
    r.id,i.eid,i.name,i.pr,i.la,i.ab,i.otH||0,i.ndH||0,
    i.basic,i.ot,i.nd,i.lded,i.aded,
    i.taxableExtras||0,i.nonTaxExtras||0,i.deminimisTotal||0,
    i.gross,i.sss,(i.mpf||0),i.ph,i.pi,i.tax,i.loan,
    i.extraDeductions||0,i.total,i.net
  ]));
  const loans=LOANS.map(l=>{const emp=USERS.find(u=>u.id===l.eid);return[
    l.id,emp?.eid||l.eid,emp?.name||'',l.type,l.amount,l.balance,l.monthly,l.status,l.started,l.remarks||''
  ];});
  const bundy=BUNDY_LOGS.map(b=>[
    b.id,b.eid,b.empName,b.type,b.date,b.time,
    b.lat||'',b.lng||'',b.accuracy||'',b.address||'',
    b.withinZone?'YES':'NO',b.zoneResult?.zone?.name||'',b.zoneResult?.distance||'',
    b.selfie?'YES':'NO',b.datetime||''
  ]);
  const zones=OFFICE_ZONES.map(z=>[z.id,z.name,z.lat,z.lng,z.radius,z.address||'']);
  const shifts=(COMPANY.shifts||[]).map(s=>{
    const norm=TimekeepingCore.normalizeShift(s);
    return[s.id,s.name,JSON.stringify(norm.schedule),s.graceMinutes||0,s.active!==false?'TRUE':'FALSE',new Date().toISOString()];
  });
  const employeeShifts=USERS.filter(u=>u.role==='employee').map(u=>{
    const s=(COMPANY.shifts||[]).find(x=>x.id===u.shiftId);
    return[u.eid,u.name||'',u.shiftId||'',s?.name||'',new Date().toISOString()];
  });
  const scheduleAdjustments=USERS.flatMap(u=>(u.scheduleAdjustments||[]).map(a=>[
    a.id,u.eid,u.name||'',a.from,a.to,a.start,a.end,a.status||'',a.approvedBy||'',a.approvedAt||''
  ]));
  const attendanceFormConfig=(COMPANY.attendanceForms||[]).map(f=>[
    f.key,f.visible!==false?'TRUE':'FALSE',new Date().toISOString()
  ]);
  const settings=Object.entries({
    companyName:COMPANY.name,tagline:COMPANY.tagline,initials:COMPANY.initials,
    theme:COMPANY.themeKey,accentColor:COMPANY.accentHex,
    bundySelfie:COMPANY.bundySelfie?'true':'false',
    bundyPublicAccess:COMPANY.bundyPublicAccess?'true':'false',
    empNumPrefix:EMP_NUM_CONFIG.prefix,
    empNumSeparator:EMP_NUM_CONFIG.separator,
    empNumDigits:String(EMP_NUM_CONFIG.digits),
    empNumNextSeq:String(EMP_NUM_CONFIG.nextSeq),
    empNumManual:EMP_NUM_CONFIG.manual?'true':'false',
  }).map(([k,v])=>[k,v,new Date().toISOString()]);
  /* Field configuration schema — custom fields + visibility */
  const fieldConfig=allCustom.map(f=>[
    f.id,f.label,f.description||'',f.key,f.type,
    (f.options||[]).join('|'),
    f.required?'TRUE':'FALSE',
    Object.keys(FIELD_CONFIG).find(t=>FIELD_CONFIG[t].custom.some(x=>x.id===f.id))||'',
    new Date().toISOString(),
  ]);
  /* Visibility settings */
  const fieldVisibility=Object.entries(FIELD_CONFIG).flatMap(([tabKey,cfg])=>
    Object.entries(cfg.visible).map(([fieldKey,visible])=>[
      tabKey, fieldKey, visible?'TRUE':'FALSE',
      cfg.required[fieldKey]?'TRUE':'FALSE'
    ])
  );
  return{
    Employees:emps,Attendance:att,Leave_Requests:leaves,
    Payroll_Runs:payRuns,Payroll_Items:payItems,
    Loans:loans,Bundy_Logs:bundy,Office_Zones:zones,
    Company_Settings:settings,
    Shift_Config:shifts,
    Employee_Shifts:employeeShifts,
    Schedule_Adjustments:scheduleAdjustments,
    Attendance_Form_Config:attendanceFormConfig,
    Field_Config:fieldConfig,
    Field_Visibility:fieldVisibility,
  };
}


async function gsPushAll(){
  if(GS.status!=='connected'){await gsPing();if(GS.status!=='connected')return;}
  const payload=buildSyncPayload();
  const sheets=Object.entries(payload);
  GS.pushing=true;
  GS.pushProgress={total:sheets.length,done:0,current:'',failed:0,items:[]};
  gsLog('Starting push — '+sheets.length+' sheets…','info');
  if(view==='gsheets')goTab(1); // stay on Sync tab
  render();
  try{
    let totalRows=0;
    for(const[sheetName,rows]of sheets){
      GS.pushProgress.current=sheetName;
      render();
      try{
        const d=await gsCall(null,{action:'push',entity:sheetName,data:rows,replace:true});
        if(!d.ok)throw new Error(d.error||'Server returned ok:false. Redeploy your Apps Script.');
        const written=d.written||rows.length;
        totalRows+=written;
        GS.pushProgress.done++;
        GS.pushProgress.items.push({name:sheetName,rows:written,ok:true});
        gsLog('✓ '+sheetName+' — '+written+' rows','ok');
      }catch(e){
        GS.pushProgress.done++;
        GS.pushProgress.failed++;
        GS.pushProgress.items.push({name:sheetName,rows:rows.length,ok:false,err:e.message});
        gsLog('✗ '+sheetName+': '+e.message,'error');
      }
      render();
    }
    GS.lastSync=new Date().toISOString();
    GS.pushProgress.current='';
    if(GS.pushProgress.failed===0){
      gsLog('All done — '+sheets.length+' sheets, '+totalRows+' rows ✅','ok');
    }else{
      gsLog('Done with '+GS.pushProgress.failed+' error(s)','error');
    }
  }catch(e){
    GS.pushProgress.current='';
    gsLog('Push failed: '+e.message,'error');
  }
  GS.pushing=false;
  render();
}

async function gsPullAll(){
  if(GS.status!=='connected'){await gsPing();if(GS.status!=='connected')return;}
  if(!confirm('Pull all data from Google Sheets? This will REPLACE current app data.'))return;
  gsLog('Pulling all data from Google Sheets…','info');render();
  try{
    const d=await gsCall({action:'pullAll'});
    if(!d.ok)throw new Error(d.error);
    const summary=Object.entries(d.data||{}).map(([k,v])=>k+': '+v.length+' rows').join('\n');
    gsLog('Pull complete ✅','ok');
    alert('✅ Data pulled from Google Sheets:\n\n'+summary);
  }catch(e){gsLog('Pull failed: '+e.message,'error');alert('Pull failed: '+e.message);}
  render();
}

async function gsPushEntity(entity,rows){
  if(GS.status!=='connected')return;
  try{
    const d=await gsCall(null,{action:'push',entity,data:rows,replace:true});
    if(!d.ok)throw new Error(d.error||'ok:false');
    gsLog('Synced '+entity+' ('+rows.length+' rows)','ok');
  }catch(e){gsLog('Sync error '+entity+': '+e.message,'error');}
}

          ['1','Open Google Sheets','Go to <a href="https://sheets.google.com" target="_blank" style="color:var(--accent)">sheets.google.com</a> and create a new spreadsheet. Name it "SproutRipple PH Database".'],
          ['2','Open Apps Script','In the spreadsheet: Extensions → Apps Script. Delete default code.'],
          ['3','Paste the script','Paste the entire contents of <strong>sproutripple_sheets.gs</strong> (download below) into the editor. Save (Ctrl+S).'],
          ['4','Run Setup','Click Run → select <strong>setupSheets</strong>. Authorize when prompted. This creates all 11 sheets.'],
          ['5','Deploy as Web App','Deploy → New Deployment → Type: Web App → Execute as: Me → Access: Anyone → Click Deploy. Copy the URL.'],
          ['6','Paste URL above','Paste the Web App URL into the field above. Click Test Connection.'],
        ].map(([n,t,d])=>`<div style="display:flex;gap:12px;align-items:flex-start">
          <div style="width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">${n}</div>
          <div><div style="font-weight:600;font-size:13px">${t}</div><div style="font-size:12px;color:var(--txt3);margin-top:2px">${d}</div></div>
        </div>`).join('')}
      </div>
    </div>`;}

  else if(tab===1){
    const p=GS.pushProgress;
    const pct=p.total>0?Math.round((p.done/p.total)*100):0;
    const isPushing=GS.pushing;
    body=`
    <!-- Progress bar (visible while pushing or after push) -->
    ${isPushing||p.items.length?`
    <div class="card" style="margin-bottom:1rem">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div style="font-weight:600;font-size:14px">${isPushing?'Pushing to Google Sheets…':'Push complete'}</div>
        <div style="font-size:13px;font-weight:700;font-family:'JetBrains Mono',monospace;color:${p.failed>0?'var(--amber)':isPushing?'var(--accent)':'var(--green)'}">${pct}%</div>
      </div>
      <!-- Outer bar -->
      <div style="background:var(--bg);border-radius:999px;height:10px;overflow:hidden;margin-bottom:8px">
        <div style="height:100%;border-radius:999px;transition:width .4s ease;width:${pct}%;background:${p.failed>0?'var(--amber)':isPushing?'var(--accent)':'var(--green)'}"></div>
      </div>
      <!-- Current sheet being pushed -->
      ${isPushing&&p.current?`<div style="font-size:12px;color:var(--txt3);margin-bottom:10px;display:flex;align-items:center;gap:7px">
        <div style="width:8px;height:8px;border-radius:50%;background:var(--accent);animation:blink 1s infinite"></div>
        Syncing <strong>${p.current}</strong>…
      </div>`:''}
      <!-- Sheet-by-sheet results -->
      <div style="display:grid;gap:4px">
        ${p.items.map(it=>`<div style="display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;background:${it.ok?'var(--green-bg)':'var(--red-bg)'}">
          <span style="font-size:14px">${it.ok?'✅':'❌'}</span>
          <span style="font-size:12px;font-weight:500;flex:1">${it.name}</span>
          <span class="mono" style="font-size:11px;color:${it.ok?'var(--green-txt)':'var(--red-txt)'}">${it.ok?it.rows+' rows':it.err||'failed'}</span>
        </div>`).join('')}
        ${isPushing&&p.current?`<div style="display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;background:var(--accent-bg)">
          <span style="font-size:14px">⏳</span>
          <span style="font-size:12px;font-weight:500;flex:1">${p.current}</span>
          <span style="font-size:11px;color:var(--accent-txt)">syncing…</span>
        </div>`:''}
        ${isPushing?[...Array(Math.max(0,p.total-p.done-(p.current?1:0)))].map((_,i)=>`<div style="display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;background:var(--bg)">
          <span style="font-size:14px;opacity:.3">○</span>
          <span style="font-size:12px;color:var(--txt3)">Waiting…</span>
        </div>`).join(''):''}
      </div>
      ${!isPushing?`<div style="margin-top:10px;padding:8px 12px;border-radius:7px;font-size:13px;font-weight:600;text-align:center;background:${p.failed>0?'var(--amber-bg)':'var(--green-bg)'};color:${p.failed>0?'var(--amber-txt)':'var(--green-txt)'}">
        ${p.failed>0?`⚠️ ${p.done-p.failed} of ${p.total} sheets synced · ${p.failed} failed`:`✅ All ${p.total} sheets synced · ${GS.lastSync?'Last sync: '+new Date(GS.lastSync).toLocaleTimeString('en-PH'):''}` }
      </div>`:''}
    </div>`:''  }

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem">
      <div class="card">
        <div class="card-title" style="margin-bottom:.875rem">Push to Google Sheets</div>
        <p style="font-size:13px;color:var(--txt2);margin-bottom:12px">Send all current app data to Google Sheets. Replaces all existing rows.</p>
        <div style="display:grid;gap:8px">
          <button class="btn btn-primary" onclick="gsPushAll()" ${GS.status!=='connected'||isPushing?'disabled':''} style="position:relative;overflow:hidden">
            ${isPushing?`<span style="display:flex;align-items:center;gap:8px;justify-content:center"><span style="display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin 0.7s linear infinite"></span>Pushing ${p.done}/${p.total}…</span>`:'⬆ Push All Data Now'}
          </button>
          <button class="btn" onclick="gsPushEntity('Employees',buildSyncPayload().Employees)" ${GS.status!=='connected'||isPushing?'disabled':''}>Push Employees only</button>
          <button class="btn" onclick="gsPushEntity('Attendance',buildSyncPayload().Attendance)" ${GS.status!=='connected'||isPushing?'disabled':''}>Push Attendance only</button>
          <button class="btn" onclick="gsPushEntity('Payroll_Runs',buildSyncPayload().Payroll_Runs);gsPushEntity('Payroll_Items',buildSyncPayload().Payroll_Items)" ${GS.status!=='connected'||isPushing?'disabled':''}>Push Payroll only</button>
        </div>
      </div>
      <div class="card">
        <div class="card-title" style="margin-bottom:.875rem">Pull from Google Sheets</div>
        <p style="font-size:13px;color:var(--txt2);margin-bottom:12px">Read data from Google Sheets. Use after manually editing rows in the sheet.</p>
        <button class="btn" onclick="gsPullAll()" ${GS.status!=='connected'||isPushing?'disabled':''}>⬇ Pull All Data</button>
        <div style="margin-top:10px">
          <label style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;padding:10px 12px;border-radius:8px;border:1.5px solid ${GS.autoSync?'var(--accent)':'var(--border)'};background:${GS.autoSync?'var(--accent-bg)':'var(--bg)'}">
            <div>
              <div style="font-weight:600;font-size:13px;color:${GS.autoSync?'var(--accent-txt)':'var(--txt)'}">⚡ Auto-Sync</div>
              <div style="font-size:11px;color:var(--txt3);margin-top:2px">Push changes to Sheets automatically (2.5s debounce)</div>
            </div>
            <input type="checkbox" style="width:auto;accent-color:var(--accent);transform:scale(1.3)" ${GS.autoSync?'checked':''} onchange="GS.autoSync=this.checked;if(!GS.autoSync){clearTimeout(_syncTimer);_syncQueue.clear();}render()"/>
          </label>
        </div>
        ${GS.lastSync?`<div style="font-size:11px;color:var(--txt3);margin-top:8px">Last sync: ${new Date(GS.lastSync).toLocaleString('en-PH')}</div>`:''}
      </div>
    </div>
    <div style="padding:10px 14px;background:var(--amber-bg);border-radius:8px;font-size:12px;color:var(--amber-txt)">
      <strong>Note:</strong> Passwords and selfie photos are never sent to Google Sheets. All other data is included.
    </div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}</style>`;}

  else if(tab===2){
    const sheets=[
      {name:'Employees',desc:'Full 201 file — all fields from the Add Employee form',cols:SHEET_DEFS['Employees']?.length||60,icon:'👤'},
      {name:'Attendance',desc:'All attendance records including OT and night differential hours',cols:11,icon:'🕐'},
      {name:'Leave_Requests',desc:'All leave applications with approval status',cols:12,icon:'📅'},
      {name:'Payroll_Runs',desc:'One row per payroll run with totals',cols:8,icon:'💰'},
      {name:'Payroll_Items',desc:'Detailed per-employee payroll breakdown per run',cols:26,icon:'📊'},
      {name:'Bundy_Logs',desc:'Web bundy clock-in/out with GPS coordinates',cols:15,icon:'📍'},
      {name:'Loans',desc:'All employee loans with balance tracking',cols:10,icon:'💳'},
      {name:'Office_Zones',desc:'Geofencing zones for Web Bundy',cols:6,icon:'🏢'},
      {name:'Company_Settings',desc:'Company name, theme, and system settings',cols:3,icon:'⚙️'},
      {name:'Profile_Changes',desc:'Employee self-edit approval requests',cols:11,icon:'✏️'},
      {name:'Audit_Log',desc:'System activity log — who did what and when',cols:6,icon:'📋'},
    ];
    body=`<table><thead><tr><th>Sheet</th><th>Contents</th><th>Columns</th></tr></thead>
    <tbody>${sheets.map(s=>`<tr>
      <td><span style="font-size:16px;margin-right:6px">${s.icon}</span><strong>${s.name}</strong></td>
      <td style="font-size:12px;color:var(--txt2)">${s.desc}</td>
      <td style="text-align:center" class="mono">${s.cols}</td>
    </tr>`).join('')}</tbody></table>`;}

  else{body=`${GS.log.length?GS.log.map(l=>`<div style="display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--border);font-size:12px">
    <span style="color:var(--txt3);flex-shrink:0;font-family:'JetBrains Mono',monospace">${l.time}</span>
    <span style="color:${logColors[l.type]||'var(--txt2)'}">${l.msg}</span>
  </div>`).join(''):`<div class="empty-state">No activity yet. Connect and push data to see logs.</div>`}`;}

  return`<div class="page-header"><div><div class="page-title">Google Sheets Sync</div>
  <div style="display:flex;align-items:center;gap:7px;margin-top:3px">
    <div style="width:8px;height:8px;border-radius:50%;background:${statusColor[GS.status]}"></div>
    <span style="font-size:12px;color:${statusColor[GS.status]}">${GS.status}</span>
  </div></div>
  ${GS.status==='connected'?`<button class="btn btn-primary" onclick="gsPushAll()">⬆ Push All to Sheets</button>`:''}</div>
  <div class="tabs">${tabs.map((t,i)=>`<div class="tab${tab===i?' active':''}" onclick="goTab(${i})">${t}</div>`).join('')}</div>
  <div class="card">${body}</div>`;
}

        </div>

    <!-- Theme (full-width) -->

            : `<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:11px;color:var(--txt3);text-align:center">No<br>wallpaper</div>`}

              if(COMPANY.logo){COMPANY.wallpaper=COMPANY.logo;COMPANY.wallpaperMode='tile-large';applyWallpaperPreview();toast('Logo set as watermark','success');render();}

          </div>
          ${COMPANY.wallpaper?`
          <div class="field" style="margin:0">
            <label>Watermark Strength <span id="wp-str-lbl" style="color:var(--accent);font-weight:700">${Math.round((COMPANY.wallpaperOpacity||0.12)*100)}%</span> <span style="font-weight:400;font-size:11px;color:var(--txt3)">— how visible the pattern is</span></label>

              <span style="font-size:12px;color:var(--txt3);min-width:32px">${Math.round((COMPANY.wallpaperVeil||0.88)*100)}%</span>

            <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--txt3);margin-top:3px;padding:0 2px">

              <span>Cleaner text →</span>

          </div>
          <div class="field" style="margin:0">
            <label>Display Mode</label>

          </div>`:''}

    </div>
    <div class="card">

function applyWallpaperPreview(){
  const el=document.getElementById('content-area');
  const bgRgb=COMPANY.darkMode?'15,23,42':'244,243,239';
  const bgHex=COMPANY.darkMode?'#0f172a':'#f4f3ef';
  if(!COMPANY.wallpaper){
    document.body.style.backgroundImage='';
    document.body.style.backgroundSize='';
    document.body.style.backgroundRepeat='';
    document.body.style.backgroundAttachment='';
    if(el){el.style.backgroundImage='';el.style.backgroundSize='';el.style.backgroundRepeat='';}
    return;
  }
  /* ── Watermark effect on body ──────────────────────────────────────────
     Layer 1: semi-opaque base color  →  washes out the image
     Layer 2: the wallpaper image     →  shows through at wallpaperOpacity
     Result: a genuine watermark — faint, non-intrusive pattern on the bg */
  const strength=COMPANY.wallpaperOpacity||0.12;          /* 0.05–0.30 */
  const wash=Math.max(0,Math.min(1,1-strength)).toFixed(3);/* alpha of wash layer */
  const rp=COMPANY.wallpaperMode==='cover'||COMPANY.wallpaperMode==='contain'?'no-repeat':'repeat';
  const sz=COMPANY.wallpaperMode==='tile-large'?'280px':COMPANY.wallpaperMode==='cover'||COMPANY.wallpaperMode==='contain'?COMPANY.wallpaperMode:'140px';
  document.body.style.backgroundImage='linear-gradient(rgba('+bgRgb+','+wash+'),rgba('+bgRgb+','+wash+')),url('+COMPANY.wallpaper+')';
  document.body.style.backgroundRepeat='repeat,'+rp;
  document.body.style.backgroundSize='100% 100%,'+sz;
  document.body.style.backgroundAttachment='fixed,fixed';
  /* ── Veil on content-area — extra readability layer over content ───── */
  if(el){
    const v=COMPANY.wallpaperVeil||0.88;
    const va=Math.round(v*255).toString(16).padStart(2,'0');
    el.style.backgroundImage='linear-gradient('+bgHex+va+','+bgHex+va+')';
    el.style.backgroundRepeat='repeat';
    el.style.backgroundSize='100% 100%';
  }
}
function applyDarkMode(on){
  COMPANY.darkMode=!!on;
  if(on){document.documentElement.setAttribute('data-dark','');}
  else{document.documentElement.removeAttribute('data-dark');}
  applyWallpaperPreview();
  render();
}

/* ─── Immediate Head & Approver helpers ─────────────────── */
function getApprovalChain(empEid,maxLayersOverride){
  /* Resolves the full approval chain for empEid.
     - Number of layers comes from per-employee config (or defaultLayers).
     - Each layer defaults to following the immediate-head hierarchy.
     - Overrides in perEmployee[eid].overrides replace specific layers with custom approvers.
     - maxLayersOverride lets callers cap the chain for preview purposes. */
  const emp=USERS.find(u=>u.eid===empEid);
  if(!emp)return[];
  const empCfg=APPROVAL_CONFIG.perEmployee?.[empEid]||{};
  const numLayers=Math.min(
    maxLayersOverride||empCfg.layers||APPROVAL_CONFIG.defaultLayers||1,
    APPROVAL_CONFIG.maxLayers||4
  );
  const overrides=empCfg.overrides||{};

  /* Pre-compute the natural chain positions (immediate head hierarchy) */
  const natural=[];
  let curEid=empEid;
  const visited=new Set([empEid]);
  for(let i=0;i<numLayers;i++){
    const cur=USERS.find(u=>u.eid===curEid);
    const head=cur?USERS.find(u=>u.eid===cur.immediateHeadEid):null;
    natural.push(head||null);
    if(head&&!visited.has(head.eid)){visited.add(head.eid);curEid=head.eid;}
    else{for(let j=i+1;j<numLayers;j++)natural.push(null);break;}
  }

  /* Build resolved chain — apply overrides per layer */
  const chain=[];
  for(let i=0;i<numLayers;i++){
    const layerNum=i+1;
    const overrideEid=overrides[String(layerNum)];
    if(overrideEid){
      const ov=USERS.find(u=>u.eid===overrideEid);
      if(ov){chain.push({layer:layerNum,approver:ov,mode:'custom'});continue;}
    }
    if(natural[i])chain.push({layer:layerNum,approver:natural[i],mode:'chain'});
  }
  return chain;
}

function openApprovalConfig(empId){
  const emp=USERS.find(u=>u.id===empId);

  const cfg=APPROVAL_CONFIG.perEmployee?.[emp.eid]||{};

    },
  };
  render();
}

function saveApprovalConfig(){
  const m=modal;if(!m?.draft)return;
  const emp=USERS.find(u=>u.id===m.empId);if(!emp)return;
  if(!APPROVAL_CONFIG.perEmployee)APPROVAL_CONFIG.perEmployee={};
  /* Clean out empty overrides */
  const cleanOverrides={};
  Object.entries(m.draft.overrides||{}).forEach(([k,v])=>{if(v)cleanOverrides[k]=v;});
  APPROVAL_CONFIG.perEmployee[emp.eid]={
    layers:m.draft.layers,
    overrides:cleanOverrides,
  };
  queueSync('Approval_Config');
  closeM();
}

function resetApprovalConfig(empEid){
  if(!confirm('Reset to default (follow chain only)?'))return;
  if(APPROVAL_CONFIG.perEmployee)delete APPROVAL_CONFIG.perEmployee[empEid];
  queueSync('Approval_Config');
  render();
}

function numFmt(v){
  const n=parseFloat(v);
  if(isNaN(n))return'—';
  return n.toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
}

function normalizeDailyDivisor(value,fallback=''){
  const divisor=Number(value);
  if(!Number.isFinite(divisor)||divisor<=0||divisor>31)return fallback;
  return +divisor.toFixed(4);
}
function isDailyDivisorInputValid(value){
  const input=String(value??'').trim();
  return /^\d+(?:\.\d{1,4})?$/.test(input)&&normalizeDailyDivisor(input,null)!==null;
}
function formatDailyDivisor(value){
  const divisor=normalizeDailyDivisor(value,22);
  return Number(divisor).toFixed(4).replace(/\.?0+$/,'');
}

function employeeRecurringAllowances(emp){
  if(!Array.isArray(emp.recurringAllowances))emp.recurringAllowances=[];
  const grp=PAYROLL_GROUPS.find(g=>g.id===emp.payGroupId);
  const frequency=['monthly','semi-monthly','weekly','bi-weekly'].includes(grp?.freq)?grp.freq:'monthly';
  [{field:'mobileAllowance',code:'LOAD'},{field:'riceAllowance',code:'RICE'}].forEach(legacy=>{
    const amount=parseFloat(emp[legacy.field])||0;
    if(amount&&!emp.recurringAllowances.some(a=>a.legacyField===legacy.field))emp.recurringAllowances.push({
      id:`RA-${emp.id}-${legacy.code}`,payItemCode:legacy.code,monthlyAmount:amount,frequency,timing:'every-2nd',
      effectiveFrom:emp.hired||today(),effectiveTo:'',active:true,notes:'Migrated from legacy employee profile',legacyField:legacy.field
    });
  });
  return emp.recurringAllowances;
}

function saveEmpEdit(){
  const e=USERS.find(u=>u.id===detailEmpId);
  if(!e)return;
  if(detailDraft.dailyDivisor!==undefined&&detailDraft.dailyDivisor!==''&&!isDailyDivisorInputValid(detailDraft.dailyDivisor)){
    alert('Daily Rate Divisor must be between 1 and 31, with up to 4 decimal places.');return;
  }
  /* EID duplicate check */
  if(detailDraft.eid&&detailDraft.eid!==e.eid){
    const dup=USERS.find(u=>u.id!==e.id&&u.eid===detailDraft.eid);
    if(dup){alert('Employee ID "'+detailDraft.eid+'" already belongs to '+dup.name+'. Choose a different EID.');return;}
  }
  /* Govt number format validation */
  const govtErrs=['sss','ph','pi','tin'].filter(k=>detailDraft[k]!==undefined).map(k=>validateGovtNum(k,detailDraft[k])).filter(Boolean);
  if(govtErrs.length){alert('Government number issues:\n\n'+govtErrs.join('\n'));return;}
  /* Duplicate govt numbers */
  const merged={...e,...detailDraft};
  const dupErrs=findDuplicates(merged,e.id);
  if(dupErrs.length&&!confirm('Possible duplicates:\n\n'+dupErrs.join('\n')+'\n\nSave anyway?'))return;
  /* Detect movement-tracked field changes */
  const movChanges=detectMovementChanges(e,detailDraft);
  if(movChanges.length){
    /* Open reason modal before applying save */
    modal={type:'movementReason',empId:detailEmpId,changes:movChanges,
      mType:movementType(movChanges),draft:{...detailDraft},reason:'',effectiveDate:today()};
    render();return;
  }
  /* No tracked changes — save directly */
  applyEmpSave('');
}

function applyEmpSave(reason){
  const e=USERS.find(u=>u.id===detailEmpId);
  if(!e)return;
  /* If called from movement modal, restore draft */
  const draftToApply=modal?.type==='movementReason'?modal.draft:detailDraft;
  if(draftToApply.rdo!==undefined)draftToApply.rdo=normalizeRdoCode(draftToApply.rdo);
  /* Record movement if reason provided */
  if(reason!==null){
    const movChanges=modal?.type==='movementReason'?modal.changes:detectMovementChanges(e,draftToApply);
    if(movChanges.length){
      if(!e.movements)e.movements=[];
      e.movements.unshift({
        id:Date.now(),
        date:today(),                         /* when it was recorded in the system */
        time:new Date().toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit'}),
        effectiveDate:modal?.effectiveDate||today(), /* when the change officially takes effect */
        type:modal?.mType||movementType(movChanges),
        reason:reason||'No reason provided',
        changedBy:user?.name||'System',
        changes:movChanges,
      });
    }
  }
  /* Merge draft */
  Object.assign(e,draftToApply);
  e.name=`${e.firstName} ${e.lastName}`.trim();
  e.address=e.permanentAddress||e.city||'';
  const months=COMPANY.salaryMultiplier||13;
  e.salaryPA=+(e.salaryPM*months).toFixed(2);
  if('dailyDivisor' in draftToApply||'salaryPM' in draftToApply){
    e.dailyDivisor=e.dailyDivisor?normalizeDailyDivisor(e.dailyDivisor,''):'';
    const divisor=parseFloat(e.dailyDivisor)||COMPANY.dailyDivisor||22;
    if(parseFloat(e.salaryPM)>0)e.rate=+(e.salaryPM/divisor).toFixed(4);
  }
  if(draftToApply.managerId){
    const mgr=USERS.find(u=>u.eid===e.managerId);
    e.managerFirst=mgr?.firstName||'';e.managerLast=mgr?.lastName||'';e.managerTitle=mgr?.pos||'';
  }
  /* Termination logic */
  if(e.terminationType&&e.terminationType!==''&&e.terminationType!=='N/A'){
    const tod=today();
    const hasFutureDate=e.effectiveTermDate&&e.effectiveTermDate>tod;
    const hasReachedDate=e.effectiveTermDate&&e.effectiveTermDate<=tod;
    if(hasFutureDate){
      e.projectedAttrition=true;e.active=true;
      alert(`ℹ Projected Attrition noted for ${e.name}.\n\nEffective date: ${e.effectiveTermDate}\n\nAccess remains active until that date is reached.`);
    } else if(hasReachedDate||!e.effectiveTermDate){
      if(e.active!==false){
        e.active=false;e.status='terminated';e.projectedAttrition=false;
        alert(`⚠ Access automatically disabled for ${e.name} — "${e.terminationType}".`);
      }
    }
  } else if(e.effectiveTermDate&&e.effectiveTermDate<=today()&&e.active!==false){
    e.active=false;e.status='terminated';e.projectedAttrition=false;
  }
  closeM();
  detailEdit=false;detailDraft={};
  /* Re-sync payroll group membership if any criteria-relevant field changed */
  const criteriaFields=['payType','type','bandLevel','entityName','bu','dept','pos','costCenter','nonMass','status'];
  /* Also include any custom employment fields */
  const customKeys=(FIELD_CONFIG?.employment?.custom||[]).map(function(f){return f.key;});
  const allCriteriaFields=criteriaFields.concat(customKeys);
  const hasCriteriaChange=allCriteriaFields.some(function(f){return f in draftToApply;});
  if(hasCriteriaChange){
    const oldGroupId=e.payGroupId;
    /* Always skip explicit priority — criteria rules drive the group assignment */
    syncGroupMembership(true);
    const newGroupId=e.payGroupId;
    if(oldGroupId!==newGroupId){
      const oldGrp=PAYROLL_GROUPS.find(g=>g.id===oldGroupId);
      const newGrp=PAYROLL_GROUPS.find(g=>g.id===newGroupId);
      const changedField=allCriteriaFields.find(function(f){return f in draftToApply;})||'employment data';
      toast(e.name+' moved from "'+(oldGrp?.name||'no group')+'" to "'+(newGrp?.name||'no group')+'" — '+changedField+' updated.','info');
    }
  }
  render();queueSync('Employees');
}

function addCustomField(tabKey){
  modal={type:'customField',tabKey,idx:null,
    draft:{label:'',description:'',type:'text',options:'',required:false}};
  render();
}

function editCustomField(tabKey,idx){
  const f=FIELD_CONFIG[tabKey].custom[idx];
  modal={type:'customField',tabKey,idx,
    draft:{label:f.label,description:f.description||'',type:f.type,
           options:Array.isArray(f.options)?f.options.join(', '):f.options||'',
           required:!!f.required}};
  render();
}

function saveCustomField(){
  const m=modal;
  if(!m?.draft)return;
  const lbl=(document.getElementById('cf-label')?.value||'').trim();
  if(!lbl){alert('Field label is required.');return;}
  const desc=(document.getElementById('cf-desc')?.value||'').trim();
  /* type is stored in modal.draft by the radio button onclick */
  const type=m.draft.type||'text';
  const optsRaw=(document.getElementById('cf-opts')?.value||m.draft.options||'');
  const options=optsRaw.split(',').map(o=>o.trim()).filter(Boolean);
  if(type==='select'&&!options.length){
    alert('Dropdown type requires at least one option — enter them separated by commas.');return;
  }
  const required=document.getElementById('cf-req')?.checked||false;
  const key='custom_'+lbl.toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'');
  const cfg=FIELD_CONFIG[m.tabKey];
  if(m.idx===null){
    if(cfg.custom.find(f=>f.key===key)){
      alert(`A field with the key "${key}" already exists. Use a different label.`);return;
    }
    cfg.custom.push({id:nCustomField++,label:lbl,description:desc,key,type,options,required,default:''});
  }else{
    Object.assign(cfg.custom[m.idx],{label:lbl,description:desc,type,options,required});
  }
  queueSync('Field_Config','Field_Visibility');
  closeM();
}

function cancelOffboarding(){
  const e=USERS.find(u=>u.id===detailEmpId);
  if(!e)return;
  const hasActive=e.terminationType||e.projectedAttrition||e.effectiveTermDate;
  if(!hasActive)return;
  const summary=[];
  if(e.terminationType)summary.push(`Termination type: ${e.terminationType}`);
  if(e.effectiveTermDate)summary.push(`Effective date: ${e.effectiveTermDate}`);
  if(e.projectedAttrition)summary.push('Tagged as Projected Attrition');
  if(e.active===false)summary.push('Account is currently disabled');
  if(!confirm(`Cancel offboarding for ${e.name}?\n\n${summary.join('\n')}\n\nThis will:\n• Clear all termination details\n• Restore Projected Attrition / termination tags\n• Re-enable account access`))return;
  /* Clear all offboarding fields */
  e.terminationType='';
  e.effectiveTermDate='';
  e.lastWorkDate='';
  e.lastEmpDate='';
  e.attritionCode='';
  e.mutual='';
  e.regrettable='';
  e.rehireable='TBD';
  e.separationType='';
  e.projectedAttrition=false;
  /* Re-enable account */
  e.active=true;
  e.status=e.type==='probationary'?'probationary':'active';
  /* Clear draft if in edit mode */
  detailEdit=false;
  detailDraft={};
  alert(`✅ Offboarding cancelled for ${e.name}.\n\nAccount has been re-enabled and all termination details cleared.`);
  render();
  queueSync('Employees');
}

function addStatItem(){
  const label=prompt('Label (e.g. "CPF Employee", "SOCSO"):');
  if(!label?.trim())return;
  const country=prompt('Country code (e.g. SG, MY, AU — leave blank if global):','');
  STATUTORY_CONFIG.items.push({
    id:'custom_'+nStatItem++,
    label:label.trim(),
    visible:true,
    country:(country||'').trim().toUpperCase(),
    builtin:false,
    computeKey:'custom',
  });
  queueSync('Field_Config');
  render();
}

function editStatItem(idx){
  const it=STATUTORY_CONFIG.items[idx];
  const label=prompt('Label:',it.label);
  if(label?.trim())it.label=label.trim();
  if(!it.builtin){
    const country=prompt('Country code:',it.country||'');
    it.country=(country||'').trim().toUpperCase();
  }
  queueSync('Field_Config');
  render();
}
